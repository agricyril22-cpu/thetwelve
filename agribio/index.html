<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AgriBio Invest</title>
<meta name="description" content="AgriBio Rabbit Farm Invest : gestion des projets d'investissement agropastoraux et des investisseurs.">
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AgriBio Invest">
<meta name="application-name" content="AgriBio Invest">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --brand:#166534; --brand-2:#14532d; --brand-3:#0b3b20; --gold:#c8a13a; --earth:#9a5b2e;
  --bg:#f4f6f2; --surface:#ffffff; --surface-2:#eef2ea; --line:#dde4d8; --line-2:#c7d2c0;
  --fg:#17221a; --fg-2:#4b5a4f; --fg-3:#7b887e;
  --accent:#15803d; --accent-soft:#e3f3e7; --accent-fg:#ffffff;
  --good:#15803d; --good-soft:#e3f3e7; --warn:#b45309; --warn-soft:#fdf0dc; --bad:#b91c1c; --bad-soft:#fbe5e5; --info:#1d4ed8; --info-soft:#e5ecfc;
  --c-rev:#15803d; --c-exp:#c2410c;
  --shadow:0 1px 2px rgba(20,40,25,.06),0 6px 20px rgba(20,40,25,.06);
  --f-display:"Outfit",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c130e; --surface:#131d16; --surface-2:#1a271e; --line:#253529; --line-2:#334837;
  --fg:#e7efe8; --fg-2:#a9baad; --fg-3:#7d8e81;
  --accent:#4ade80; --accent-soft:#163522; --accent-fg:#052e12;
  --good:#4ade80; --good-soft:#163522; --warn:#fbbf24; --warn-soft:#3a2c10; --bad:#f87171; --bad-soft:#3d1818; --info:#93b4fd; --info-soft:#172442;
  --c-rev:#4ade80; --c-exp:#fb923c;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c130e; --surface:#131d16; --surface-2:#1a271e; --line:#253529; --line-2:#334837;
  --fg:#e7efe8; --fg-2:#a9baad; --fg-3:#7d8e81;
  --accent:#4ade80; --accent-soft:#163522; --accent-fg:#052e12;
  --good:#4ade80; --good-soft:#163522; --warn:#fbbf24; --warn-soft:#3a2c10; --bad:#f87171; --bad-soft:#3d1818; --info:#93b4fd; --info-soft:#172442;
  --c-rev:#4ade80; --c-exp:#fb923c;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--fg-2)} .dim{color:var(--fg-3)} .small{font-size:12.5px}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}

/* shell */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,var(--brand-2),var(--brand-3));color:#dcebdf;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
.install-btn{display:flex;align-items:center;gap:9px;width:100%;margin-top:12px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font-weight:600;cursor:pointer;text-align:left}
.install-btn:hover{background:rgba(255,255,255,.15)}
.install-btn svg{width:18px;height:18px;flex:none;color:#bbf7d0}
.plat{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.plat.cur{border-color:var(--accent);background:var(--accent-soft)}
.plat h4{font-size:15px;margin-bottom:6px}
.plat ol{margin:0;padding-left:20px;font-size:13.5px}
.plat li{margin:3px 0}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}
.brand img{width:42px;height:42px;border-radius:11px;flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:17px;color:#fff;line-height:1.15}
.brand span{font-size:11.5px;color:#a8c8b0;letter-spacing:.04em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#86a88e;padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:#dcebdf;text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:rgba(255,255,255,.13);color:#fff}
.nav a.on svg{opacity:1;color:#bbf7d0}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:11.5px;color:#86a88e;border-top:1px solid rgba(255,255,255,.1)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 28px}
.top h1{font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-btn{display:none}
#view{padding:24px calc(28px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) 28px;max-width:1360px;width:100%}
.top{padding-top:calc(12px + env(safe-area-inset-top))!important}

/* ui */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:9px;font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:7px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>.hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card>.hd h3{font-size:15.5px;flex:1}
.card>.bd{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.cur{font-size:.78em;font-weight:500;opacity:.85}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12px;color:var(--fg-2);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-family:var(--f-display);font-size:21px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:12.5px;color:var(--fg-3);margin-top:2px}
.kpi.hl{background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent;color:#fff}
.kpi.hl .l,.kpi.hl .s{color:#c9e8d2}
.sec{margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sec h2{font-size:17px;flex:1}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-3);font-weight:600;background:var(--surface-2);white-space:nowrap}
th.r,td.r{text-align:right}
tbody tr:hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
tr.click{cursor:pointer}
tfoot td{font-weight:700;background:var(--surface-2)}
.empty{padding:34px 20px;text-align:center;color:var(--fg-2)}
.empty b{display:block;font-family:var(--f-display);font-size:16px;color:var(--fg);margin-bottom:4px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.badge.good{background:var(--good-soft);color:var(--good)} .badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.info{background:var(--info-soft);color:var(--info)}
.ptype{display:inline-flex;align-items:center;gap:8px}
.ptype i{font-style:normal;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center;font-size:16px;flex:none}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none;background:var(--brand)}
.who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who>span>span{display:block;font-size:12px;color:var(--fg-3)}
.prog{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:99px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.inp,select.inp,textarea.inp{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:8px 11px;min-width:0;width:100%}
.inp:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
.toolbar .inp{width:auto;flex:0 1 240px}
.toolbar .search{flex:1 1 260px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--fg-2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.hero{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.hero .ic{width:58px;height:58px;border-radius:15px;background:var(--accent-soft);display:grid;place-items:center;font-size:30px;flex:none}
.hero h2{font-size:24px}
.hero .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--fg-2);font-size:13px;margin-top:5px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.dl dt{color:var(--fg-3)} .dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.bars .b{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.bars .t{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bars .t>div{height:100%;border-radius:99px;background:var(--accent)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--fg-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--fg-3);font-size:10px;font-family:var(--f-body)}
.note{background:var(--info-soft);color:var(--fg);border-radius:10px;padding:12px 14px;font-size:13.5px;border:1px solid color-mix(in srgb,var(--info) 25%,transparent)}
.note.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.formula{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-size:14px}
.formula .tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}

/* forms / modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,20,12,.5);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.dlg{background:var(--surface);border-radius:16px;width:min(680px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.dlg .hd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dlg .hd h3{flex:1;font-size:17px}
.dlg .bd{padding:18px 20px;overflow:auto}
.dlg .ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.span2{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:600;color:var(--fg-2)}
.f label .req{color:var(--bad)}
.f .hint{font-size:11.5px;color:var(--fg-3)}
.f.err .inp{border-color:var(--bad)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:500;box-shadow:var(--shadow);animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#lock{position:fixed;inset:0;z-index:300;background:linear-gradient(160deg,var(--brand-2),var(--brand-3));display:grid;place-items:center;padding:16px}
#lock[hidden]{display:none}
#lock .box{background:var(--surface);border-radius:18px;padding:28px;width:min(380px,100%);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#lock img{width:64px;height:64px;border-radius:16px}
.print-head{display:none}

@media (max-width:1080px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:90;transform:translateX(-100%);transition:transform .2s ease}
  body.nav-open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .menu-btn{display:inline-flex}
  .top{padding:10px 16px}
  .top h1{font-size:17px}
  #view{padding:16px calc(16px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .form{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .v{font-size:18px}
  .bars .b{grid-template-columns:90px 1fr auto}
  .top .hide-m{display:none}
  .toolbar .inp{flex:1 1 140px}
}
@media print{
  .side,.top,.no-print,.btn,.tabs{display:none!important}
  .app{display:block}
  #view{padding:0;max-width:none}
  body{background:#fff;color:#000;font-size:12px}
  .card,.kpi{box-shadow:none;break-inside:avoid}
  .print-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #166534;padding-bottom:10px;margin-bottom:16px}
}
</style>
</head>
<body>
<div id="lock" hidden><div class="box">
  <img src="icons/icon.svg" alt="">
  <h2 style="margin:12px 0 4px">AgriBio Invest</h2>
  <p class="muted" style="margin:0 0 16px">Saisissez le code d'accès pour ouvrir l'application.</p>
  <form id="lockForm"><input class="inp" id="lockPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Code d'accès" style="text-align:center;font-size:18px;letter-spacing:.3em">
  <p id="lockErr" class="bad small" style="min-height:18px;margin:6px 0"></p>
  <button class="btn pri" style="width:100%">Déverrouiller</button></form>
</div></div>

<div class="app">
  <aside class="side" id="side">
    <div class="brand"><img src="icons/icon.svg" alt=""><div><b>AgriBio Invest</b><span>Rabbit Farm</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
    <button class="install-btn" id="installBtn" hidden></button>
  </aside>
  <div class="main">
    <header class="top">
      <button class="btn icon ghost menu-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1 id="title">Tableau de bord</h1>
      <div class="row" id="topActions"></div>
      <button class="btn icon ghost" id="themeBtn" title="Thème clair / sombre" aria-label="Changer de thème"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="modal" class="modal" hidden><div class="dlg" role="dialog" aria-modal="true"><div class="hd"><h3 id="mTitle"></h3><button class="btn icon ghost" id="mClose" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="bd" id="mBody"></div><div class="ft" id="mFoot"></div></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================================
   AgriBio Rabbit Farm Invest — gestion des projets d'investissement
   Données stockées localement (localStorage) · export / import JSON
   ========================================================================= */
const APP_VERSION='1.1.0';
const LS='agribio-invest-v1';

/* ---------- référentiels ---------- */
const TYPES={
  cunicole:{l:'Cunicole',d:'Élevage de lapins',e:'🐇'},
  avicole:{l:'Avicole',d:'Poulets, pondeuses, pintades',e:'🐔'},
  achatiniculture:{l:'Achatiniculture',d:'Élevage d’escargots géants',e:'🐌'},
  pisciculture:{l:'Pisciculture',d:'Tilapia, silures, carpes',e:'🐟'},
  porcin:{l:'Porcin',d:'Élevage de porcs',e:'🐖'},
  apiculture:{l:'Apiculture',d:'Miel et produits de la ruche',e:'🐝'},
  agricole:{l:'Agricole',d:'Cultures vivrières et de rente',e:'🌽'},
  maraichage:{l:'Maraîchage',d:'Légumes et fruits',e:'🥬'},
  autre:{l:'Autre',d:'Autre activité',e:'🌱'}
};
const STATUS={
  preparation:{l:'En préparation',c:''},
  levee:{l:'Levée de fonds',c:'info'},
  en_cours:{l:'En exploitation',c:'good'},
  suspendu:{l:'Suspendu',c:'warn'},
  cloture:{l:'Clôturé',c:'bad'}
};
const METHODS=['Espèces','Orange Money','MTN Mobile Money','Virement bancaire','Chèque','Autre'];
const CAT_EXP=['Achat de cheptel / alevins / semences','Alimentation et provende','Soins vétérinaires et intrants','Infrastructure et équipement','Main-d’œuvre','Énergie et eau','Transport et logistique','Frais administratifs','Autre dépense'];
const CAT_REV=['Vente de production','Vente de géniteurs / reproducteurs','Vente de sous-produits (fumier, peaux…)','Subvention / appui','Autre recette'];

/* ---------- utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- accès aux données ---------- */
const P=id=>db.projects.find(x=>x.id===id);
const I=id=>db.investors.find(x=>x.id===id);
const pName=id=>P(id)?.name||'(projet supprimé)';
const iName=id=>I(id)?.name||'(investisseur supprimé)';
const sgn=m=>m.kind==='retrait'?-1:1;
function moves({p,i,to}={}){return db.investments.filter(m=>(!p||m.projectId===p)&&(!i||m.investorId===i)&&(!to||m.date<=to))}
const capital=(o={})=>sum(moves(o),m=>sgn(m)*m.amount);
function investorsOf(pid,to){const ids=[...new Set(moves({p:pid,to}).map(m=>m.investorId))];return ids.filter(i=>capital({p:pid,i,to})>0)}
function tx({p,kind,from,to}={}){return db.transactions.filter(t=>(!p||t.projectId===p)&&(!kind||t.kind===kind)&&(!from||t.date>=from)&&(!to||t.date<=to))}
const txSum=o=>sum(tx(o),t=>t.amount);
function allocs({p,i}={}){const out=[];for(const d of db.distributions){if(p&&d.projectId!==p)continue;for(const a of d.allocations){if(i&&a.investorId!==i)continue;out.push({...a,dist:d})}}return out}
const gains=o=>sum(allocs(o),a=>a.amount);
const paid=o=>sum(allocs(o).filter(a=>a.paid),a=>a.amount);

/* répartition pondérée par le temps : capital × jours de présence dans la période */
function timeWeight(pid,iid,ps,pe){
  let w=0;
  for(const m of moves({p:pid,i:iid,to:pe})){const start=m.date<ps?ps:m.date;w+=sgn(m)*m.amount*Math.max(0,days(start,pe))}
  return Math.max(0,w);
}
/* répartition au plus fort reste : la somme des parts arrondies = la cagnotte exacte */
function allocate(pool,rows){
  const W=sum(rows,r=>r.weight);
  rows.forEach(r=>{r.share=W?r.weight/W:0;const x=pool*r.share;r.amount=Math.floor(x);r._f=x-r.amount});
  let rest=pool-sum(rows,r=>r.amount);
  [...rows].sort((a,b)=>b._f-a._f).forEach(r=>{if(rest>0){r.amount++;rest--}});
  rows.forEach(r=>delete r._f);
  return rows;
}
function computeDist(o){
  const revenue=Math.round(+o.revenue||0),expenses=Math.round(+o.expenses||0);
  const profit=revenue-expenses;
  const fee=profit>0?Math.round(profit*(+o.feePct||0)/100):0;
  const distributable=Math.max(0,profit-fee);
  const pool=Math.round(distributable*(+o.sharePct||0)/100);
  const promoter=distributable-pool;
  let rows=investorsOf(o.projectId,o.periodEnd).map(iid=>{
    const cap=capital({p:o.projectId,i:iid,to:o.periodEnd});
    return{investorId:iid,capital:cap,weight:o.method==='temps'?timeWeight(o.projectId,iid,o.periodStart,o.periodEnd):cap};
  }).filter(r=>r.weight>0);
  rows=allocate(pool,rows);
  return{revenue,expenses,profit,fee,distributable,pool,promoter,rows};
}
function lastDistEnd(pid){const ds=db.distributions.filter(d=>d.projectId===pid).sort((a,b)=>b.periodEnd.localeCompare(a.periodEnd));return ds[0]?.periodEnd}
function projectStats(p){
  const cap=capital({p:p.id}),rev=txSum({p:p.id,kind:'recette'}),exp=txSum({p:p.id,kind:'depense'});
  const g=gains({p:p.id}),pd=paid({p:p.id});
  return{cap,rev,exp,res:rev-exp,gains:g,paid:pd,due:g-pd,investors:investorsOf(p.id).length,progress:p.target?cap/p.target:0,roi:cap?g/cap:0};
}
function investorStats(iid){
  const cap=capital({i:iid}),g=gains({i:iid}),pd=paid({i:iid});
  const apports=sum(moves({i:iid}).filter(m=>m.kind!=='retrait'),m=>m.amount);
  const projects=[...new Set(moves({i:iid}).map(m=>m.projectId))];
  return{cap,apports,gains:g,paid:pd,due:g-pd,roi:cap?g/cap:0,projects};
}

let modalClose=null;
function openModal(title,body,foot){$('#mTitle').textContent=title;$('#mBody').innerHTML=body;$('#mFoot').innerHTML=foot||'';$('#modal').hidden=false;setTimeout(()=>{const f=$('#mBody input:not([type=hidden]),#mBody select,#mBody textarea');f&&f.focus()},30)}
function closeModal(){$('#modal').hidden=true;$('#mBody').innerHTML='';modalClose&&modalClose();modalClose=null}
$('#mClose').onclick=closeModal;
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

function field(f,v){
  const id='f_'+f.k,req=f.req?' <span class="req">*</span>':'';
  let inp;
  const val=v??f.def??'';
  if(f.type==='select')inp=`<select class="inp" id="${id}" name="${f.k}">${f.options.map(([k,l])=>`<option value="${esc(k)}"${String(k)===String(val)?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
  else if(f.type==='textarea')inp=`<textarea class="inp" id="${id}" name="${f.k}" rows="3">${esc(val)}</textarea>`;
  else inp=`<input class="inp" id="${id}" name="${f.k}" type="${f.type||'text'}" value="${esc(val)}"${f.min!=null?` min="${f.min}"`:''}${f.max!=null?` max="${f.max}"`:''}${f.step?` step="${f.step}"`:''}${f.list?` list="${id}_l"`:''} ${f.type==='number'?'inputmode="decimal"':''}>${f.list?`<datalist id="${id}_l">${f.list.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}`;
  return `<div class="f${f.span?' span2':''}" data-k="${f.k}"><label for="${id}">${esc(f.label)}${req}</label>${inp}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`;
}
function formModal(title,fields,values,onSave,extra){
  openModal(title,`<form id="mForm" class="form" novalidate>${fields.map(f=>field(f,values?.[f.k])).join('')}</form>${extra||''}`,
    `<button class="btn" type="button" id="mCancel">Annuler</button><button class="btn pri" type="button" id="mSave">${ic('check')}Enregistrer</button>`);
  $('#mCancel').onclick=closeModal;
  const submit=()=>{
    const out={};let ok=true;
    for(const f of fields){
      const el=$('#f_'+f.k);let v=el.value.trim();
      if(f.type==='number')v=v===''?'':+v.replace(',','.');
      const bad=(f.req&&(v===''||v==null))||(f.type==='number'&&v!==''&&(isNaN(v)||(f.min!=null&&v<f.min)));
      el.closest('.f').classList.toggle('err',!!bad);
      if(bad)ok=false;
      out[f.k]=v;
    }
    if(!ok){toast('Veuillez compléter les champs obligatoires');return}
    const r=onSave(out);
    if(r===false)return;
    save();closeModal();render();
  };
  $('#mSave').onclick=submit;
  $('#mForm').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();submit()}});
}
function confirmBox(title,msg,okLabel,onOk){
  openModal(title,`<p style="margin:0">${msg}</p>`,`<button class="btn" id="cNo">Annuler</button><button class="btn pri" id="cOk" style="background:var(--bad);border-color:var(--bad);color:#fff">${esc(okLabel)}</button>`);
  $('#cNo').onclick=closeModal;$('#cOk').onclick=()=>{onOk();save();closeModal();render()};
}

    {k:'start',label:'Date de démarrage',type:'date',def:today()},
    {k:'end',label:'Date de fin prévue',type:'date'},
    {k:'target',label:'Objectif de financement ('+db.settings.currency+')',type:'number',min:0,step:1000},
    {k:'expectedRoi',label:'Rendement prévisionnel annuel (%)',type:'number',min:0,step:.1,hint:'Utilisé pour les projections des investisseurs'},
    {k:'sharePct',label:'Part des bénéfices aux investisseurs (%)',type:'number',min:0,max:100,step:.1,req:1,def:db.settings.defaultShare,hint:'Le reste revient au promoteur / exploitant'},
    {k:'feePct',label:'Frais de gestion sur bénéfice (%)',type:'number',min:0,max:100,step:.1,def:db.settings.defaultFee,hint:'Prélevés avant le partage'},
    {k:'status',label:'Statut',type:'select',options:Object.entries(STATUS).map(([k,s])=>[k,s.l]),def:'levee'},
    {k:'minTicket',label:'Ticket minimum ('+db.settings.currency+')',type:'number',min:0,step:1000},

    toast(p?'Projet mis à jour':'Projet créé');
  });

    {k:'kind',label:'Type',type:'select',options:[['physique','Personne physique'],['morale','Personne morale'],['association','Association / groupe']],def:'physique'},

function editMove(m,preset={}){
  if(!db.projects.length){toast('Créez d’abord un projet');return}
  if(!db.investors.length){toast('Ajoutez d’abord un investisseur');return}
  const v=m||{date:today(),kind:'apport',method:'Orange Money',...preset};
  formModal(m?'Modifier le mouvement':'Enregistrer un investissement',[
    {k:'investorId',label:'Investisseur',type:'select',options:invOpts(),req:1},
    {k:'projectId',label:'Projet',type:'select',options:projOpts(),req:1},
    {k:'kind',label:'Nature',type:'select',options:[['apport','Apport de capital'],['retrait','Retrait / remboursement de capital']]},
    {k:'date',label:'Date',type:'date',req:1},
    {k:'amount',label:'Montant ('+db.settings.currency+')',type:'number',min:1,step:1,req:1},
    {k:'method',label:'Mode de paiement',type:'select',options:METHODS.map(x=>[x,x])},
    {k:'ref',label:'Référence (reçu, transaction)'},
    {k:'note',label:'Commentaire'}
  ],v,o=>{
    if(o.kind==='retrait'){
      let avail=capital({p:o.projectId,i:o.investorId});
      if(m&&m.projectId===o.projectId&&m.investorId===o.investorId)avail-=sgn(m)*m.amount;
      if(o.amount>avail){toast('Retrait supérieur au capital détenu ('+num(avail)+')');return false}
    }
    if(m)Object.assign(m,o);else db.investments.push({id:uid(),...o});
    toast(m?'Mouvement mis à jour':(o.kind==='retrait'?'Retrait enregistré':'Investissement enregistré'));
  });
}
function editTx(t,preset={}){
  if(!db.projects.length){toast('Créez d’abord un projet');return}
  const v=t||{date:today(),kind:'depense',...preset};
  const kind=v.kind;
  formModal(t?'Modifier l’opération':(kind==='recette'?'Nouvelle recette':'Nouvelle dépense'),[
    {k:'projectId',label:'Projet',type:'select',options:projOpts(),req:1},
    {k:'kind',label:'Type',type:'select',options:[['recette','Recette (vente, produit)'],['depense','Dépense (charge)']]},
    {k:'date',label:'Date',type:'date',req:1},
    {k:'amount',label:'Montant ('+db.settings.currency+')',type:'number',min:1,step:1,req:1},
    {k:'category',label:'Catégorie',list:[...CAT_REV,...CAT_EXP],def:kind==='recette'?CAT_REV[0]:CAT_EXP[1]},
    {k:'qty',label:'Quantité / détail',hint:'Ex. : 120 lapins vendus, 15 sacs de provende'},
    {k:'label',label:'Libellé',span:1}
  ],v,o=>{
    if(t)Object.assign(t,o);else db.transactions.push({id:uid(),...o});
    toast('Opération enregistrée');
  });
}

function monthlyChart(pid){
  const now=new Date(),months=[];
  for(let k=11;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}
  const data=months.map(m=>{const t=db.transactions.filter(x=>(!pid||x.projectId===pid)&&x.date.startsWith(m));return{m,r:sum(t.filter(x=>x.kind==='recette'),x=>x.amount),e:sum(t.filter(x=>x.kind==='depense'),x=>x.amount)}});
  const max=Math.max(1,...data.map(d=>Math.max(d.r,d.e)));
  const W=600,H=200,pl=44,pb=22,cw=(W-pl)/12,bw=Math.min(14,cw/2-3);
  const y=v=>H-pb-(v/max)*(H-pb-10);
  const ticks=[0,.5,1].map(f=>max*f);
  const short=v=>v>=1e6?(v/1e6).toLocaleString('fr-FR',{maximumFractionDigits:1})+' M':v>=1e3?Math.round(v/1e3)+' k':Math.round(v);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Recettes et dépenses sur 12 mois">`;
  ticks.forEach(t=>{s+=`<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="${t?'3 3':''}"/><text x="${pl-6}" y="${y(t)+3}" text-anchor="end">${short(t)}</text>`});
  data.forEach((d,k)=>{const x=pl+k*cw+cw/2;
    s+=`<rect x="${x-bw-1}" y="${y(d.r)}" width="${bw}" height="${H-pb-y(d.r)}" rx="2" fill="var(--c-rev)"><title>${d.m} · recettes ${num(d.r)}</title></rect>`;
    s+=`<rect x="${x+1}" y="${y(d.e)}" width="${bw}" height="${H-pb-y(d.e)}" rx="2" fill="var(--c-exp)"><title>${d.m} · dépenses ${num(d.e)}</title></rect>`;
    s+=`<text x="${x}" y="${H-6}" text-anchor="middle">${new Date(d.m+'-01T00:00').toLocaleDateString('fr-FR',{month:'short'}).replace('.','')}</text>`});
  return s+'</svg>';
}
function barsBy(items){const max=Math.max(1,...items.map(x=>x.v));return`<div class="bars">${items.map(x=>`<div class="b"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${x.l}</span><div class="t"><div style="width:${x.v/max*100}%;${x.c?'background:'+x.c:''}"></div></div><span class="n small">${x.t??money(x.v)}</span></div>`).join('')}</div>`}

      allocations:c.rows.map(r=>({investorId:r.investorId,capital:r.capital,weight:r.weight,share:r.share,amount:r.amount,paid:false,paidDate:''}))};
    db.distributions.push(d);save();toast('Répartition validée');go('#/repartition/'+d.id);

}

function bindSim(){
  const f=$('#sForm'),f2=$('#s2Form');if(!f)return;
  const setP=()=>{const p=P(f.p.value);f.fee.value=p.feePct||0;f.share.value=p.sharePct??60};
  const run=()=>{
    const p=P(f.p.value),profit=+f.profit.value||0,fee=Math.round(profit*(+f.fee.value||0)/100),pool=Math.round((profit-fee)*(+f.share.value||0)/100);
    const rows=allocate(pool,investorsOf(p.id).map(i=>({investorId:i,capital:capital({p:p.id,i}),weight:capital({p:p.id,i})})));
    $('#sOut').innerHTML=`<div class="formula"><span>Bénéfice net</span><span class="n">${money(profit)}</span><span class="muted">− Frais de gestion</span><span class="n">${money(fee)}</span><span class="tot good">À partager entre les investisseurs</span><span class="tot n good">${money(pool)}</span></div>
      ${rows.length?`<div class="tbl-wrap" style="margin-top:14px"><table><thead><tr><th>Investisseur</th><th class="r">Capital</th><th class="r">Gain simulé</th><th class="r">Rendement</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${who(r.investorId)}</td><td class="r n">${money(r.capital)}</td><td class="r n good">${money(r.amount)}</td><td class="r n">${pct(r.capital?r.amount/r.capital:0)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Aucun investisseur sur ce projet.</p>'}`;
  };
  const run2=()=>{
    const a=+f2.amount.value||0,r=(+f2.roi.value||0)/100,n=Math.min(30,Math.max(1,+f2.years.value||1)),re=f2.mode.value==='reinvesti';
    let c=a,tot=0,rows='';
    for(let y=1;y<=n;y++){const g=Math.round(c*r);tot+=g;if(re)c+=g;rows+=`<tr><td>Année ${y}</td><td class="r n">${money(re?c-g:a)}</td><td class="r n good">${money(g)}</td><td class="r n">${money(re?c:a+tot)}</td></tr>`}
    $('#s2Out').innerHTML=`<div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))">${kpi('Gains totaux',money(tot),'',1)}${kpi('Valeur finale',money(a+tot),'Multiplié par '+(a?((a+tot)/a).toLocaleString('fr-FR',{maximumFractionDigits:2}):'—'))}</div>
      <div class="tbl-wrap"><table><thead><tr><th>Année</th><th class="r">Capital</th><th class="r">Gain</th><th class="r">Valeur cumulée</th></tr></thead><tbody>${rows}</tbody></table></div><p class="small dim">Simulation indicative : les rendements agricoles dépendent des cycles de production, des prix de vente et des aléas sanitaires.</p>`;
  };
  f.addEventListener('change',e=>{if(e.target.name==='p')setP();run()});f.addEventListener('input',run);
  f2.addEventListener('input',run2);f2.addEventListener('change',run2);
  setP();run();run2();
}

/* ---------- export ---------- */
function download(name,content,type){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportCSV(k){
  const c=v=>{const s=String(v??'');return/[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  let head,rows;
  if(k==='projects'||k==='report'){head=['Projet','Filière','Statut','Localisation','Responsable','Démarrage','Objectif','Capital','Investisseurs','Recettes','Dépenses','Résultat','Gains distribués','Payé','Reste à payer','Part investisseurs %','Frais %'];rows=db.projects.map(p=>{const s=projectStats(p);return[p.name,TYPES[p.type]?.l,STATUS[p.status]?.l,p.location,p.manager,p.start,p.target,s.cap,s.investors,s.rev,s.exp,s.res,s.gains,s.paid,s.due,p.sharePct,p.feePct]})}
  else if(k==='investors'){head=['Nom','Type','Téléphone','E-mail','Adresse','Pièce','Adhésion','Capital','Gains','Payé','Reste à payer','Rendement %'];rows=db.investors.map(i=>{const s=investorStats(i.id);return[i.name,i.kind,i.phone,i.email,i.address,i.idDoc,i.joined,s.cap,s.gains,s.paid,s.due,(s.roi*100).toFixed(2)]})}
  else if(k==='investments'){head=['Date','Investisseur','Projet','Nature','Montant','Mode','Référence','Commentaire'];rows=db.investments.map(m=>[m.date,iName(m.investorId),pName(m.projectId),m.kind,m.amount,m.method,m.ref,m.note])}
  else if(k==='transactions'){head=['Date','Projet','Type','Catégorie','Libellé','Quantité','Montant'];rows=db.transactions.map(t=>[t.date,pName(t.projectId),t.kind,t.category,t.label,t.qty,t.amount])}
  else if(k==='allocations'){head=['Début période','Fin période','Projet','Investisseur','Capital','Quote-part %','Montant','Payé','Date paiement','Mode'];rows=allocs().map(a=>[a.dist.periodStart,a.dist.periodEnd,pName(a.dist.projectId),iName(a.investorId),a.capital,(a.share*100).toFixed(4),a.amount,a.paid?'oui':'non',a.paidDate,a.paidMode])}
  download('agribio-'+k+'-'+today()+'.csv','﻿'+[head,...rows].map(r=>r.map(c).join(';')).join('\r\n'),'text/csv;charset=utf-8');
}

/* ---------- filtres ---------- */
document.addEventListener('input',e=>{const k=e.target.dataset?.filter;if(!k)return;state[k]=e.target.value;const pos=e.target.selectionStart;render();const el=$(`[data-filter="${k}"]`);if(el){el.focus();if(el.setSelectionRange&&pos!=null)try{el.setSelectionRange(pos,pos)}catch(x){}}});

/* ---------- rendu ---------- */
let lastRoute='';
function render(){
  const h=location.hash||'#/';
  const [,a,b,c]=h.split('/');
  const route=(a||'')+'/'+(b||'');
  if(route!==lastRoute){state.q='';state.f1='';state.f2='';state.tab='inv';lastRoute=route;window.scrollTo(0,0)}
  let html;
  switch(a){
    case '':case undefined:html=vDashboard();break;
    case 'projets':html=vProjects();break;
    case 'projet':html=vProject(b);break;
    case 'investisseurs':html=vInvestors();break;
    case 'investisseur':html=vInvestor(b);break;
    case 'investissements':html=vMoves();break;
    case 'operations':html=vOps();break;
    case 'repartitions':html=vDists();break;
    case 'repartition':html=b==='nouvelle'?vNewDist(c):vDist(b);break;
    case 'simulateur':html=vSim();break;
    case 'rapports':html=vReports();break;
    case 'parametres':html=vSettings();break;
    default:html=notFound();
  }
  $('#view').innerHTML=html;
  renderNav();
}

/* ---------- verrouillage ---------- */
async function hash(s){
  const data=new TextEncoder().encode('agribio:'+s);
  if(crypto?.subtle){const b=await crypto.subtle.digest('SHA-256',data);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=5381;for(const x of data)h=((h<<5)+h+x)>>>0;return 'd'+h.toString(16);
}
function lock(){
  if(!db.settings.pinHash){return}
  try{if(sessionStorage.getItem('agribio-unlocked')===db.settings.pinHash)return}catch(e){}
  $('#lock').hidden=false;setTimeout(()=>$('#lockPin').focus(),50);
  $('#lockForm').onsubmit=async e=>{e.preventDefault();if(await hash($('#lockPin').value)===db.settings.pinHash){$('#lock').hidden=true;$('#lockPin').value='';try{sessionStorage.setItem('agribio-unlocked',db.settings.pinHash)}catch(x){}}else{$('#lockErr').textContent='Code incorrect';$('#lockPin').select()}};
}

/* ---------- installation (ordinateur, tablette, smartphone) ---------- */
let installEvt=null;
function isStandalone(){return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: window-controls-overlay)').matches||navigator.standalone===true}
function platform(){
  const ua=navigator.userAgent;
  if(/iPhone|iPod/.test(ua))return'iphone';
  if(/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1))return'ipad';
  if(/Android/.test(ua))return'android';
  if(/Macintosh/.test(ua)&&/Safari/.test(ua)&&!/Chrome|Chromium|Edg/.test(ua))return'macsafari';
  return'desktop';
}

window.addEventListener('appinstalled',()=>{installEvt=null;toast('AgriBio Invest est installée');renderNav()});
$('#installBtn').onclick=()=>installApp();
