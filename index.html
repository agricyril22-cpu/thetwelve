on. Le Secrétaire général définira ensuite les mots de passe de la Présidente, du Trésorier, du Commissaire aux comptes et du Censeur.":"The Secretary General and the President have full management of the application. The Secretary General will then set the passwords of the President, the Treasurer, the Auditor and the Censor.","Le Trésorier":"The Treasurer","Le Trésorier suit les versements au fur et à mesure de la séance : qui a payé, ce qui manque, la caisse, les bénéficiaires, les prêts du jour.":"The Treasurer follows payments as the meeting goes on: who has paid, what is missing, the cash box, the beneficiaries, today's loans.","Le bouton « Rédiger proprement » met vos notes au style d'un compte rendu officiel, sans inventer de faits ni modifier les montants. Il demande une connexion Internet et une clé API Anthropic (créée sur console.anthropic.com, facturée à l'usage). La clé reste sur cet ordinateur et n'est jamais incluse dans les sauvegardes.":"The \"Write it properly\" button turns your notes into the style of official minutes, without inventing facts or changing amounts. It requires an Internet connection and an Anthropic API key (created on console.anthropic.com, billed by use). The key stays on this computer and is never included in backups.","Le bureau":"The board","Le bureau exécutif":"The executive board","Le bureau n’a pas encore lancé l’organisation.":"The board has not started organising yet.","Le calcul compare la tontine versée au montant attendu par séance, saisi dans la fiche de chaque membre.":"The calculation compares the tontine paid with the amount expected per meeting, entered in each member's file.","Le commissaire au compte":"The auditor","Le compte bancaire suit le récépissé.":"The bank account follows the receipt.","Le jour de l'AG, rejoignez le direct pour suivre le point en cours, demander la parole, écrire et voter.":"On the day of the GM, join the live meeting to follow the current item, ask to speak, write and vote.","Le lien doit commencer par https://chat.whatsapp.com/":"The link must start with https://chat.whatsapp.com/","Le micro n'est pas accessible. Autorisez le micro pour l'application, puis réessayez.":"The microphone is not accessible. Allow the microphone for the application, then try again.","Le montant s’affichera ici lorsque le bureau publiera la cassation.":"The amount will appear here when the board publishes the payout.","Le mot de passe doit contenir au moins # caractères.":"The password must contain at least # characters.","Le numéro":"The number","Le président":"The chair","Le texte est vide.":"The text is empty.","Les aides accordées par nature : maladie, naissance, décès, mariage, rentrée scolaire…":"Aid granted by type: illness, birth, death, wedding, school start…","Les banques demandent en général le récépissé, les statuts et un PV qui désigne les signataires. Un compte au nom de la Présidente est une solution transitoire : prévoyez au moins deux signatures (Présidente + Trésorier) dès que le compte passe au nom de l’association.":"Banks usually ask for the receipt, the statutes and minutes appointing the signatories. An account in the President's name is a temporary solution: plan at least two signatures (President + Treasurer) as soon as the account is in the association's name.","Les cases grises indiquent le montant attendu (tontine selon les parts, collation # FCFA, solidarité # FCFA).":"Grey boxes show the expected amount (tontine by shares, refreshments # FCFA, solidarity # FCFA).","Les codes ne seront plus affichés":"The codes will not be shown again","Les corrections demandées lors de l'adoption du compte rendu apparaîtront ici.":"Corrections requested when the minutes are adopted will appear here.","Les deux mots de passe sont différents.":"The two passwords are different.","Les données sont enregistrées sur cet ordinateur. Téléchargez une sauvegarde régulièrement (clé USB, e-mail). Pour changer d'ordinateur, installez l'application puis restaurez la sauvegarde. Les mots de passe du bureau sont inclus dans la sauvegarde sous forme chiffrée.":"Data is saved on this computer. Download a backup regularly (USB stick, e-mail). To change computer, install the application then restore the backup. Board passwords are included in the backup in encrypted form.","Les fondateurs doivent résider au Togo. Plusieurs membres sont de nationalité camerounaise : chaque membre étranger du bureau fournit sa carte de séjour en cours de validité. Vérifiez les dates d’expiration avant le dépôt.":"The founders must live in Togo. Several members are Cameroonian nationals: each foreign board member provides a valid residence permit. Check expiry dates before submitting.","Les frais et les pièces peuvent évoluer : confirmez-les auprès du ministère au moment du dépôt. Pour une question juridique précise, consultez un juriste.":"Fees and documents may change: confirm them with the ministry when submitting. For a specific legal question, consult a lawyer.","Les liens s'affichent dans le menu, sur « Mon espace » et dans la rubrique WhatsApp. Le direct passe par un relais Internet ; les messages y sont chiffrés. Si vous changez le code secret, envoyez une nouvelle sauvegarde à tous les membres.":"The links appear in the menu, on \"My area\" and in the WhatsApp section. The live meeting goes through an Internet relay; messages are encrypted. If you change the secret code, send a new backup to all members.","Les membres consultent leurs données et les comptes rendus, sans modifier ni imprimer. Les nouveaux droits s'appliquent à la prochaine connexion de la personne et passent sur les autres ordinateurs avec la sauvegarde.":"Members view their data and the minutes, without editing or printing. New rights apply at the person's next login and reach other computers with the backup.","Les membres consultent seulement : comptes rendus, cotisations, tour, prêts, statuts, et leur espace personnel (épargne, prêts, tour, présence). Ils peuvent aussi envoyer des suggestions. Ils ne modifient rien.":"Members only view: minutes, contributions, rotation, loans, statutes, and their personal area (savings, loans, rotation, attendance). They can also send suggestions. They change nothing.","Les membres peuvent proposer ici des idées : fonctionnement, projets, solidarité, organisation des fêtes…":"Members can propose ideas here: operation, projects, solidarity, party organisation…","Les membres présents apparaissent ici. Laissez vide pour « Rien de particulier à signaler ».":"Members present appear here. Leave empty for \"Nothing in particular to report\".","Les montants relèvent du règlement intérieur. Une fois le règlement importé, retrouvez les articles sur la solidarité dans « Statuts & règlement ».":"The amounts come from the internal rules. Once the rules are imported, find the solidarity articles in \"Statutes & rules\".","Les notes et la transcription servent à rédiger la synthèse des débats.":"Notes and the transcript are used to write the summary of the discussions.","Les projets menés ensemble par les membres : objectifs, étapes, responsables, contributions collectées et dépenses.":"Projects carried out together by members: objectives, steps, people in charge, contributions collected and expenses.","Les prêts dont l'échéance est dépassée apparaîtront ici.":"Loans past their due date will appear here.","Les statuts comportent deux « Titre III » (Éligibilité, puis Structures et attributions) : la numérotation des titres suivants est à revoir.":"The statutes contain two \"Title III\" (Eligibility, then Structures and duties): the numbering of the following titles should be reviewed.","Les textes fondateurs de THE TWELVE, consultables pendant les séances et modifiables après adoption en assemblée générale.":"THE TWELVE's founding texts, available during meetings and editable after adoption in general meeting.","Lettre de déclaration adressée au Ministre de l’Administration territoriale":"Declaration letter addressed to t Schatzmeister","Le Trésorier suit les versements au fur et à mesure de la séance : qui a payé, ce qui manque, la caisse, les bénéficiaires, les prêts du jour.":"Der Schatzmeister verfolgt die Zahlungen während der Sitzung: wer gezahlt hat, was fehlt, die Kasse, die Begünstigten, die Darlehen des Tages.","Le bouton « Rédiger proprement » met vos notes au style d'un compte rendu officiel, sans inventer de faits ni modifier les montants. Il demande une connexion Internet et une clé API Anthropic (créée sur console.anthropic.com, facturée à l'usage). La clé reste sur cet ordinateur et n'est jamais incluse dans les sauvegardes.":"Die Schaltfläche „Sauber formulieren\" bringt Ihre Notizen in den Stil eines offiziellen Protokolls, ohne Fakten zu erfinden oder Beträge zu ändern. Sie benötigt eine Internetverbindung und einen Anthropic-API-Schlüssel (auf console.anthropic.com erstellt, nach Nutzung abgerechnet). Der Schlüssel bleibt auf diesem Computer und ist nie in Sicherungen enthalten.","Le bureau":"Der Vorstand","Le bureau exécutif":"Der geschäftsführende Vorstand","Le bureau n’a pas encore lancé l’organisation.":"Der Vorstand hat die Organisation noch nicht begonnen.","Le calcul compare la tontine versée au montant attendu par séance, saisi dans la fiche de chaque membre.":"Die Berechnung vergleicht die gezahlte Tontine mit dem pro Sitzung erwarteten Betrag aus der Akte jedes Mitglieds.","Le commissaire au compte":"Der Rechnungsprüfer","Le compte bancaire suit le récépissé.":"Das Bankkonto folgt der Empfangsbestätigung.","Le jour de l'AG, rejoignez le direct pour suivre le point en cours, demander la parole, écrire et voter.":"Treten Sie am Tag der MV der Live-Sitzung bei, um den aktuellen Punkt zu verfolgen, sich zu Wort zu melden, zu schreiben und abzustimmen.","Le lien doit commencer par https://chat.whatsapp.com/":"Der Link muss mit https://chat.whatsapp.com/ beginnen","Le micro n'est pas accessible. Autorisez le micro pour l'application, puis réessayez.":"Das Mikrofon ist nicht zugänglich. Erlauben Sie das Mikrofon für die Anwendung und versuchen Sie es erneut.","Le montant s’affichera ici lorsque le bureau publiera la cassation.":"Der Betrag erscheint hier, sobald der Vorstand die Auszahlung veröffentlicht.","Le mot de passe doit contenir au moins # caractères.":"Das Passwort muss mindestens # Zeichen enthalten.","Le numéro":"Die Nummer","Le président":"Der Sitzungsleiter","Le texte est vide.":"Der Text ist leer.","Les aides accordées par nature : maladie, naissance, décès, mariage, rentrée scolaire…":"Gewährte Hilfen nach Art: Krankheit, Geburt, Todesfall, Hochzeit, Schulbeginn…","Les banques demandent en général le récépissé, les statuts et un PV qui désigne les signataires. Un compte au nom de la Présidente est une solution transitoire : prévoyez au moins deux signatures (Présidente + Trésorier) dès que le compte passe au nom de l’association.":"Banken verlangen meist die Empfangsbestätigung, die Satzung und ein Protokoll, das die Zeichnungsberechtigten benennt. Ein Konto auf den Namen der Präsidentin ist eine Übergangslösung: Sehen Sie mindestens zwei Unterschriften vor (Präsidentin + Schatzmeister), sobald das Konto auf den Verein läuft.","Les cases grises indiquent le montant attendu (tontine selon les parts, collation # FCFA, solidarité # FCFA).":"Graue Felder zeigen den erwarteten Betrag (Tontine nach Anteilen, Imbiss # FCFA, Solidarität # FCFA).","Les codes ne seront plus affichés":"Die Codes werden nicht mehr angezeigt","Les corrections demandées lors de l'adoption du compte rendu apparaîtront ici.":"Bei der Annahme des Protokolls gewünschte Korrekturen erscheinen hier.","Les deux mots de passe sont différents.":"Die beiden Passwörter sind verschieden.","Les données sont enregistrées sur cet ordinateur. Téléchargez une sauvegarde régulièrement (clé USB, e-mail). Pour changer d'ordinateur, installez l'application puis restaurez la sauvegarde. Les mots de passe du bureau sont inclus dans la sauvegarde sous forme chiffrée.":"Die Daten werden auf diesem Computer gespeichert. Laden Sie regelmäßig eine Sicherung herunter (USB-Stick, E-Mail). Für einen Computerwechsel installieren Sie die Anwendung und stellen die Sicherung wieder her. Die Vorstandspasswörter sind verschlüsselt in der Sicherung enthalten.","Les fondateurs doivent résider au Togo. Plusieurs membres sont de nationalité camerounaise : chaque membre étranger du bureau fournit sa carte de séjour en cours de validité. Vérifiez les dates d’expiration avant le dépôt.":"Die Gründer müssen in Togo wohnen. Mehrere Mitglieder sind kamerunische Staatsangehörige: Jedes ausländische Vorstandsmitglied legt einen gültigen Aufenthaltstitel vor. Prüfen Sie die Ablaufdaten vor der Einreichung.","Les frais et les pièces peuvent évoluer : confirmez-les auprès du ministère au moment du dépôt. Pour une question juridique précise, consultez un juriste.":"Gebühren und Unterlagen können sich ändern: Bestätigen Sie sie bei der Einreichung beim Ministerium. Bei einer konkreten Rechtsfrage wenden Sie sich an einen Juristen.","Les liens s'affichent dans le menu, sur « Mon espace » et dans la rubrique WhatsApp. Le direct passe par un relais Internet ; les messages y sont chiffrés. Si vous changez le code secret, envoyez une nouvelle sauvegarde à tous les membres.":"Die Links erscheinen im Menü, unter „Mein Bereich\" und in der Rubrik WhatsApp. Die Live-Sitzung läuft über ein Internet-Relais; die Nachrichten sind verschlüsselt. Wenn Sie den Geheimcode ändern, senden Sie allen Mitgliedern eine neue Sicherung.","Les membres consultent leurs données et les comptes rendus, sans modifier ni imprimer. Les nouveaux droits s'appliquent à la prochaine connexion de la personne et passent sur les autres ordinateurs avec la sauvegarde.":"Mitglieder sehen ihre Daten und die Protokolle ein, ohne zu ändern oder zu drucken. Neue Rechte gelten ab der nächsten Anmeldung der Person und gelangen mit der Sicherung auf andere Computer.","Les membres consultent seulement : comptes rendus, cotisations, tour, prêts, statuts, et leur espace personnel (épargne, prêts, tour, présence). Ils peuvent aussi envoyer des suggestions. Ils ne modifient rien.":"Mitglieder sehen nur ein: Protokolle, Beiträge, Runde, Darlehen, Satzung und ihren persönlichen Bereich (Ersparnisse, Darlehen, Runde, Anwesenheit). Sie können auch Vorschläge senden. Sie ändern nichts.","Les membres peuvent proposer ici des idées : fonctionnement, projets, solidarité, organisation des fêtes…":"Mitglieder können hier Ideen vorschlagen: Arbeitsweise, Projekte, Solidarität, Organisation der Feste…","Les membres présents apparaissent ici. Laissez vide pour « Rien de particulier à signaler ».":"Anwesende Mitglieder erscheinen hier. Leer lassen für „Nichts Besonderes zu melden\".","Les montants relèvent du règlement intérieur. Une fois le règlement importé, retrouvez les articles sur la solidarité dans « Statuts & règlement ».":"Die Beträge stammen aus der Geschäftsordnung. Nach dem Import der Ordnung finden Sie die Artikel zur Solidarität unter „Satzung & Ordnung\".","Les notes et la transcription servent à rédiger la synthèse des débats.":"Notizen und Abschrift dienen zur Erstellung der Zusammenfassung der Debatten.","Les projets menés ensemble par les membres : objectifs, étapes, responsables, contributions collectées et dépenses.":"Gemeinsam von den Mitgliedern durchgeführte Projekte: Ziele, Schritte, Verantwortliche, gesammelte Beiträge und Ausgaben.","Les prêts dont l'échéance est dépassée apparaîtront ici.":"Darlehen mit überschrittener Fälligkeit erscheinen hier.","Les statuts comportent deux « Titre III » (Éligibilité, puis Structures et attributions) : la numérotation des titres suivants est à revoir.":"Die Satzung enthält zweimal „Titel III\" (Wählbarkeit, dann Strukturen und Aufgaben): Die Nummerierung der folgenden Titel ist zu überprüfen.","Les textes fondateurs de THE TWELVE, consultables pendant les séances et modifiables après adoption en assemblée générale." const LANGS=[['fr','Français'],['en','English'],['de','Deutsch']];
const TW_MONTHS={fr:['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'],
  en:['January','February','March','April','May','June','July','August','September','October','November','December'],
  de:['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember']};
const TW_DAYS={fr:['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'],en:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],de:['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag']};
let twLang=(()=>{try{const l=localStorage.getItem('tw-lang');return I18N[l]||l==='fr'?l:'fr'}catch(e){return 'fr'}})()||'fr';
const TW_WORDS=[...TW_MONTHS.fr,...TW_DAYS.fr];
const TW_TOK=new RegExp('(?<![\\wÀ-ÿ])('+TW_WORDS.join('|')+')(?![\\wÀ-ÿ])|\\d+(?:[ \\u00a0\\u202f]\\d{3})*(?:[.,]\\d+)?','gi');
function twWord(w){const lw=w.toLowerCase();let i=TW_MONTHS.fr.indexOf(lw);let out;if(i>=0)out=TW_MONTHS[twLang][i];else{i=TW_DAYS.fr.indexOf(lw);out=i>=0?TW_DAYS[twLang][i]:w}
  return /^[A-ZÀ-Ý]/.test(w)?out.charAt(0).toUpperCase()+out.slice(1):out}
function twFill(tpl,toks){let n=0,m=0;const nums=toks.filter(t=>!t.w),words=toks.filter(t=>t.w);return tpl.replace(/[#@]/g,c=>c==='#'?(nums[n++]?.v??c):(words[m]?twWord(words[m++].v):c))}
let twPrefix=null;
function twPrefixes(){if(twPrefix&&twPrefix.l===twLang)return twPrefix.k;const D=I18N[twLang]||{};const k=Object.keys(D).filter(x=>x.length>=4&&!/[#@]/.test(x)).sort((a,b)=>b.length-a.length);twPrefix={l:twLang,k};return k}
function twExact(s){const D=I18N[twLang];if(!D)return null;const toks=[];const key=s.replace(TW_TOK,(m,w)=>{toks.push({v:m,w:!!w});return w?'@':'#'});const t=D[key];return t===undefined?null:twFill(t,toks)}
function twWords(s){return s.replace(new RegExp('(?<![\\wÀ-ÿ])('+TW_WORDS.join('|')+')(?![\\wÀ-ÿ])','gi'),w=>twWord(w))}
function tr(text,depth=0){if(twLang==='fr'||!text)return text;const lead=text.match(/^\s*/)[0],trail=text.match(/\s*$/)[0];const s=text.trim().replace(/\s+/g,' ');if(!s||!/[A-Za-zÀ-ÿ]{2}/.test(s))return text;
  let r=twExact(s);
  if(r===null&&s.includes(' · ')&&depth<2){r=s.split(' · ').map(p=>tr(p,depth+1)).join(' · ')}
  if(r===null){for(const k of twPrefixes()){if(s.length>k.length&&s.startsWith(k)&&/[\s,:·]/.test(s.charAt(k.length)||k.slice(-1))){const rest=s.slice(k.length);const sp=rest.match(/^\s*/)[0];r=I18N[twLang][k]+sp+(depth<2?tr(rest.trim(),depth+1):twWords(rest.trim()));break}}}
  if(r===null)r=twWords(s);
  return lead+r+trail}
const TW_SKIP='.paper,.doc,textarea,script,style,.no-tr,[contenteditable],.code-box,input';
const TW_ATTRS=['placeholder','title','aria-label'];
let twBusy=false;
function twTranslate(root){root=root||document.body;if(!root)return;twBusy=true;
  try{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
    while(n=w.nextNode()){const p=n.parentElement;if(!p||p.closest(TW_SKIP))continue;
      if(n.__twOut!==n.nodeValue){n.__twSrc=n.nodeValue}
      const out=twLang==='fr'?n.__twSrc:tr(n.__twSrc);if(n.nodeValue!==out)n.nodeValue=out;n.__twOut=out}
    root.querySelectorAll?.('[placeholder],[title],[aria-label]').forEach(el=>{if(el.closest('.paper,.doc,.no-tr'))return;TW_ATTRS.forEach(a=>{if(!el.hasAttribute(a))return;const v=el.getAttribute(a);const ko='data-tw-'+a;
      if(el.getAttribute(ko+'-out')!==v)el.setAttribute(ko,v);const src=el.getAttribute(ko);const out=twLang==='fr'?src:tr(src);if(v!==out)el.setAttribute(a,out);el.setAttribute(ko+'-out',out)})});
    twLangPickers()}finally{twBusy=false;twObs?.takeRecords()}}
function twPickerHTML(){return `<label class="tw-lang no-tr" title="Langue · Language · Sprache"><span aria-hidden="true">🌐</span><select data-act-change="twLang" aria-label="Langue">${LANGS.map(([k,l])=>`<option value="${k}" ${k===twLang?'selected':''}>${l}</option>`).join('')}</select></label>`}
function twLangPickers(){const spots=[$('#railfoot'),$('.login-brand')].filter(Boolean);spots.forEach(s=>{if(!s.querySelector('.tw-lang'))s.insertAdjacentHTML('beforeend',twPickerHTML())})}
function setLang(l){twLang=LANGS.some(x=>x[0]===l)?l:'fr';try{localStorage.setItem('tw-lang',twLang)}catch(e){}document.documentElement.lang=twLang;$$('.tw-lang select').forEach(s=>s.value=twLang);twTranslate(document.body)}
let twObs=null,twRq=0;
function twStart(){document.documentElement.lang=twLang;twObs=new MutationObserver(()=>{if(twBusy)return;cancelAnimationFrame(twRq);twRq=requestAnimationFrame(()=>twTranslate(document.body))});
  twObs.observe(document.body,{childList:true,subtree:true,characterData:true});twTranslate(document.body)}
document.addEventListener('change',e=>{if(e.target.dataset?.actChange==='twLang')setLang(e.target.value)});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',twStart);else setTimeout(twStart,0);
