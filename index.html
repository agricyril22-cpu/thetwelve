<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THE TWELVE Secrétariat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy side rail carrying the letterhead, working sheet on the right. Colours lifted from the THE TWELVE logo. */
:root{
  --navy:#173f68; --navy-2:#0f2e4f; --teal:#13a58a; --lime:#a5c93a; --orange:#f28a1a; --red:#d33a2c;
  --bg:#f3f6f8; --surface:#ffffff; --surface-2:#eef3f6; --line:#d9e2e8; --line-2:#c4d1da;
  --fg:#16232e; --fg-2:#4a5b69; --fg-3:#7a8a97;
  --accent:#0f8a74; --accent-soft:#e2f4ef; --accent-fg:#ffffff;
  --warn:#b8640a; --warn-soft:#fdf0e1; --bad:#c0362a; --bad-soft:#fbe7e4; --good:#1d8a4f; --good-soft:#e3f4ea; --info:#1f5d96; --info-soft:#e4eef8;
  --shadow:0 1px 2px rgba(16,40,64,.06),0 4px 16px rgba(16,40,64,.06);
  --f-display:"Lexend",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1720; --surface:#14212c; --surface-2:#1a2a37; --line:#25384a; --line-2:#33495d;
  --fg:#e6edf2; --fg-2:#a8b8c5; --fg-3:#7d8f9e;
  --accent:#2fc4a5; --accent-soft:#123a35; --accent-fg:#06221d;
  --warn:#f0a24a; --warn-soft:#3a2a14; --bad:#f07468; --bad-soft:#3d1c1a; --good:#4cc77f; --good-soft:#143322; --info:#7fb4e8; --info-soft:#16293d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1720; --surface:#14212c; --surface-2:#1a2a37; --line:#25384a; --line-2:#33495d;
  --fg:#e6edf2; --fg-2:#a8b8c5; --fg-3:#7d8f9e;
  --accent:#2fc4a5; --accent-soft:#123a35; --accent-fg:#06221d;
  --warn:#f0a24a; --warn-soft:#3a2a14; --bad:#f07468; --bad-soft:#3d1c1a; --good:#4cc77f; --good-soft:#143322; --info:#7fb4e8; --info-soft:#16293d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num,td.n,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:268px 1fr;min-height:100%}
.rail{background:var(--navy-2);color:#dfe8f0;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{padding:18px 18px 14px;background:#fff;border-bottom:4px solid var(--teal);display:flex;gap:10px;align-items:center}
.brand img{width:64px;height:auto}
.brand b{display:block;font-family:var(--f-display);font-weight:700;color:var(--navy);font-size:19px;letter-spacing:.02em;line-height:1.1}
.brand i{display:block;font-style:normal;color:var(--orange);font-weight:600;font-size:12.5px}
.brand small{display:block;color:#5a6b78;font-size:11px;margin-top:2px}
.nav{padding:10px 10px 24px;display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:#7f9ab3;padding:14px 10px 4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#d4e0ea;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14.5px}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:var(--teal);color:#fff;font-weight:600}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .badge{margin-left:auto;background:var(--orange);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700}
.rail-foot{margin-top:auto;padding:14px 18px 20px;font-size:12px;color:#8ea6bb;border-top:1px solid rgba(255,255,255,.08)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.page{padding-block:24px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));max-width:1240px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:26px;font-weight:600;color:var(--fg)}
.ph p{margin:4px 0 0;color:var(--fg-2);max-width:62ch}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:700;margin-bottom:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:14px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.06);color:var(--accent-fg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--fg-2);font-weight:600;min-width:0}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:15px;color:var(--fg);font-weight:400}
textarea.i{min-height:90px;resize:vertical;line-height:1.5}
input.i:focus,select.i:focus,textarea.i:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.spanall{grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h3{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--fg-3)}
.small{font-size:13px}
.hint{font-size:13px;color:var(--fg-3)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 9px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--teal))}
.kpi span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3);font-weight:700}
.kpi b{display:block;font-family:var(--f-display);font-size:23px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--fg-2);font-size:13px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);font-weight:700;padding:9px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tfoot td{font-weight:700;background:var(--surface-2)}
table.t tbody tr:hover{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
table.t input.i,table.t select.i{padding:5px 7px;font-size:14px;border-radius:6px}
table.t input.cell{width:108px;text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:34px 18px;text-align:center;color:var(--fg-3);border:1px dashed var(--line-2);border-radius:12px;background:var(--surface)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-weight:600;margin-bottom:4px}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--fg-2);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer;font-weight:700;font-size:13px;color:var(--fg-3);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on.P{background:var(--good-soft);color:var(--good)}
.seg button.on.L{background:#e8e3f7;color:#5b45a8}
.seg button.on.R{background:var(--warn-soft);color:var(--warn)}
.seg button.on.A{background:var(--bad-soft);color:var(--bad)}
.seg button.on.E{background:var(--info-soft);color:var(--info)}

/* lists */
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;text-align:left;width:100%}
.mcard:hover{border-color:var(--accent)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;color:#fff;flex:none;font-size:15px}
.mcard .who{min-width:0;flex:1}
.mcard .who b{display:block;font-weight:700}
.mcard .who small{color:var(--fg-3);display:block}
.meet{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;width:100%;text-align:left}
.meet:hover{border-color:var(--accent)}
.date-tile{background:var(--navy);color:#fff;border-radius:10px;text-align:center;padding:6px 0;font-family:var(--f-display)}
.date-tile b{display:block;font-size:24px;line-height:1.1}
.date-tile span{font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.85}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line-2)}
.tl{position:relative;margin-bottom:16px}
.tl::before{content:"";position:absolute;left:-23px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--teal));box-shadow:0 0 0 3px var(--bg)}
.tl .card{padding:14px 16px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.check.done span{color:var(--fg-3);text-decoration:line-through}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.matrix td.s{text-align:center;font-weight:700;font-size:13px;width:44px}
.s-P{color:var(--good)}.s-L{color:#7a62d0}.s-R{color:var(--warn)}.s-A{color:var(--bad)}.s-E{color:var(--info)}
.prose{max-width:72ch}
.prose h4{font-size:15px;margin:18px 0 6px;color:var(--navy)}
:root[data-theme="dark"] .prose h4{color:var(--fg)}
.article{padding:12px 0;border-bottom:1px solid var(--line)}
.article b{font-family:var(--f-display);font-weight:600;color:var(--accent)}
mark{background:#ffe58a;color:#16232e;border-radius:2px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,20,32,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:none}
.modal.wide{max-width:980px}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}
.modal header h2{font-size:18px;font-weight:600}
.modal .body{padding:18px 20px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy-2);color:#fff;padding:10px 18px;border-radius:10px;z-index:80;font-weight:600;box-shadow:var(--shadow)}

/* paper preview (always light, it is a printed document) */
.paperwrap{background:#e7ecf0;padding:18px;border-radius:10px;overflow-x:auto}
.paper{background:#fff;color:#1b1b1b;width:794px;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.15);padding:26px 42px 28px}
/* responsive */
@media (max-width:1080px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);height:100%;z-index:60;transform:translateX(-102%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px)}
  .rail.open{transform:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--surface)}
  .topbar img{width:38px}
  .topbar b{font-family:var(--f-display);color:var(--fg);font-size:16px}
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 60px}
  .g2,.g3{grid-template-columns:1fr}.span2,.span3{grid-column:auto}
  .ph h1{font-size:22px}
  .meet{grid-template-columns:60px 1fr}.meet>:last-child{grid-column:1/-1}
  .shade{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
}
@media (max-width:520px){.kpis{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr}.kpi b{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* v7 : espaces */
.space-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:5px;border-radius:12px;margin-bottom:16px}
.space-tabs button{display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;padding:10px;border-radius:9px;font-weight:700;color:var(--fg-2);cursor:pointer;font-size:14.5px}
.space-tabs button svg{width:17px;height:17px}.space-tabs button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.me-head{margin-bottom:16px}.me-head h1{margin-top:2px}
/* v4 */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:14px}
.cal-d{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;background:var(--surface)}
.cal-d span{font-size:11px;color:var(--fg-3)}.cal-d b{font-size:14px}.cal-d small{color:var(--fg-3);font-size:11px}.cal-d i{font-style:normal;font-size:11.5px;color:var(--fg-3);margin-top:4px}
.cal-d.done{border-color:var(--accent);background:var(--accent-soft);cursor:pointer}.cal-d.done i{color:var(--accent);font-weight:700}
.cal-d.miss{border-color:var(--warn)}.cal-d.miss i{color:var(--warn);font-weight:700}
.card.proj{cursor:pointer;transition:border-color .15s}.card.proj:hover{border-color:var(--accent)}
.st-text .li{padding-left:18px;position:relative;margin:2px 0}.st-text .li::before{content:"–";position:absolute;left:4px;color:var(--fg-3)}
.st-text .li.b1{padding-left:14px;font-weight:600;margin-top:6px}.st-text .li.b1::before{content:"▸";left:0;color:var(--accent)}
.st-text .li.b3{padding-left:34px}.st-text .li.b3::before{content:"·";left:24px}
.st-text .pl{margin:4px 0}.st-text .pl.ind{padding-left:18px}
.st-text h5{font-family:var(--f-display);font-size:14px;margin:14px 0 4px;color:var(--fg-2)}
.st-text .article{scroll-margin-top:20px}
.toc div{padding:3px 0;border-bottom:1px dashed var(--line)}
.note-warn{background:var(--warn-soft);color:var(--fg);border-radius:8px;padding:8px 10px;border-left:3px solid var(--warn)}
@media (max-width:1080px){#st-layout{grid-template-columns:1fr!important}#st-layout>.stack{position:static!important}}
/* v3 : communication */
a.btn{text-decoration:none}
.wa-btn{width:100%;margin-bottom:10px;justify-content:center;background:#1f9d55!important;border-color:#1f9d55!important;color:#fff!important;text-decoration:none}
.msg{font-family:var(--f-body);white-space:pre-wrap;min-height:220px}
.next-ag{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;border-color:var(--navy)}
.next-ag h3{color:#fff}.next-ag .hint{color:#b9cad8}
.next-ag .chip{background:rgba(255,255,255,.12);color:#fff}
.tz-list{display:flex;flex-wrap:wrap;gap:6px}
/* v2 : connexion, photos, fiches */
[hidden]{display:none!important}
body.locked .app{display:none}
body:not(.locked) #login{display:none}
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.login-brand{background:var(--navy-2);color:#dfe8f0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;padding-block:48px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:48px;position:relative;overflow:hidden}
.login-brand::after{content:"";position:absolute;right:-120px;bottom:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(19,165,138,.35),transparent 70%)}
.login-brand img{width:170px;background:#fff;border-radius:16px;padding:12px;margin-bottom:12px}
.login-brand h1{font-size:40px;color:#fff;letter-spacing:.04em;font-weight:700}
.login-brand .motto{color:var(--orange);font-weight:700;font-size:18px;margin:0 0 10px}
.login-brand p{margin:0;color:#b9cad8;max-width:36ch}
.login-brand .copy{margin-top:auto;padding-top:40px;font-size:12px;color:#8ea6bb;position:relative;z-index:1}
.login-panel{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--bg)}

<style id="doccss">
.lh{display:flex;align-items:center;gap:16px;border-bottom:3px solid #4fd1b5;padding-bottom:10px;margin-bottom:18px}
.lh img{width:118px}
.lh .t{flex:1;text-align:center}
.lh .t b{display:block;font-family:"Lexend",Arial,sans-serif;font-size:30px;font-weight:700;color:#1d3f7a;letter-spacing:.04em}
.lh .t i{display:block;font-style:normal;color:#e8a20c;font-weight:700;font-size:16px}
.lh .t small{display:block;color:#1b1b1b;font-weight:700;font-size:13px}
.pf{border-top:3px double #d33a2c;margin-top:26px;padding-top:4px;text-align:right;font-weight:700;font-size:12px;color:#1b1b1b}

/* the document body used for PDF */
.doc{font-family:"Source Sans 3",Arial,sans-serif;color:#1b1b1b;font-size:13.5px;line-height:1.45;width:710px}
.doc h1{font-family:"Lexend",Arial,sans-serif;text-align:center;font-size:18px;color:#173f68;margin:0 0 12px;text-transform:uppercase;letter-spacing:.02em}
.doc h2{font-family:"Lexend",Arial,sans-serif;font-size:14.5px;color:#173f68;margin:16px 0 6px;padding-bottom:3px;border-bottom:1.5px solid #13a58a}
.doc h3{font-size:13.5px;margin:10px 0 4px;color:#0f6e5c}
.doc p{margin:4px 0}
.doc .kv{display:grid;grid-template-columns:170px 1fr;gap:3px 10px;margin:6px 0}
.doc .kv b{color:#173f68}
.doc table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:12.5px}
.doc th{background:#173f68;color:#fff;text-align:left;padding:5px 6px;font-weight:600;border:1px solid #173f68}
.doc td{border:1px solid #b9c6cf;padding:4px 6px;vertical-align:top}
.doc td.n,.doc th.n{text-align:right;white-space:nowrap}
.doc tr:nth-child(even) td{background:#f4f8f9}
.doc tfoot td{font-weight:700;background:#e6f3ef!important}
.doc .box{border:1.5px solid #173f68;border-radius:6px;padding:8px 10px;margin:8px 0}
.doc .sig{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:14px;margin-top:22px}
.doc .sig div{border-top:1px solid #333;padding-top:4px;text-align:center;font-size:12px;font-weight:600;min-height:60px}
.doc .motto{text-align:center;font-family:"Lexend",Arial,sans-serif;font-weight:700;color:#173f68;margin:16px 0 4px;letter-spacing:.08em}
.doc .ref{display:flex;justify-content:space-between;font-size:12px;color:#444;margin-bottom:8px}
.doc .photo{width:110px;height:130px;border:1.5px dashed #888;display:grid;place-items:center;font-size:11px;color:#777;float:right;margin:0 0 8px 12px}
.doc .lettres{font-style:italic}
.doc .pb{page-break-before:always}
.doc tr{page-break-inside:avoid}


.idphoto{float:right;width:118px;height:140px;border:1.5px solid #173f68;display:grid;place-items:center;font-size:11px;color:#777;margin:0 0 8px 14px;overflow:hidden}
.idphoto img{width:100%;height:100%;object-fit:cover}
.mc-sheet{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.mcardp{width:86mm;height:54mm;border-radius:3.5mm;border:1px solid #173f68;overflow:hidden;position:relative;background:#fff;display:flex;flex-direction:column;font-size:9.5px;box-sizing:border-box}
.mc-top{background:#173f68;color:#fff;display:flex;align-items:center;gap:6px;padding:4px 8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.mc-top img{width:30px;background:#fff;border-radius:4px;padding:1px}.mc-top b{display:block;font-size:12px;letter-spacing:.05em}.mc-top i{display:block;font-style:normal;color:#f2b33d;font-size:8.5px;font-weight:700}
.mc-top span{margin-left:auto;font-size:8px;letter-spacing:.12em;font-weight:700;color:#9fe3d3}
.mc-body{display:flex;gap:8px;padding:6px 8px;flex:1}
.mc-ph{width:22mm;height:27mm;border:1px solid #173f68;border-radius:2mm;overflow:hidden;display:grid;place-items:center;color:#999;flex:none}.mc-ph img{width:100%;height:100%;object-fit:cover}
.mc-info{display:flex;flex-direction:column;gap:1.5px;min-width:0}.mc-info>b{font-size:11.5px;color:#173f68;line-height:1.15}.mc-info small{display:block;color:#13a58a;font-size:7px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.mc-foot{display:flex;justify-content:space-between;padding:2px 8px 4px;border-top:2px solid #13a58a;font-size:7.5px;color:#555}
.mcardp.back{padding:10px 12px;justify-content:center;gap:4px;text-align:center;background:linear-gradient(160deg,#fff 60%,#e6f5f1);-webkit-print-color-adjust:exact;print-color-adjust:exact}.mcardp.back p{margin:0}.mc-motto{font-weight:700;color:#173f68;margin-top:4px!important}.mcardp.back small{color:#777;font-size:7px;margin-top:4px}

.pf-big{font-family:var(--f-display);line-height:1.05;margin-top:4px}.pf-big b{font-size:38px;color:var(--accent)}.pf-big span{font-size:16px;color:var(--fg-3)}
.rec-card{border:1px solid var(--line)}.rec-dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--red,#d33);margin-right:6px;animation:recpulse 1.2s infinite}

.rec-time{font-family:var(--f-display);font-size:34px;font-variant-numeric:tabular-nums}.rec-meter{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden}.rec-meter i{display:block;height:100%;background:var(--accent);transition:width .1s}

.sv-albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-bottom:22px}
.sv-album{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;padding:0;font:inherit;color:inherit}
.sv-album:hover{box-shadow:0 6px 20px rgba(15,46,79,.12)}
.sv-cover{display:block;aspect-ratio:4/3;background:var(--surface-2);overflow:hidden;position:relative}.sv-cover img{width:100%;height:100%;object-fit:cover;display:block}

.sv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}

.sv-tile img{width:100%;height:100%;object-fit:cover;display:block}
.sv-play{position:absolute;inset:auto auto 8px 8px;background:rgba(0,0,0,.6);color:#fff;border-radius:20px;padding:2px 10px;font-size:13px}

.sv-stage img,.sv-stage video{max-width:100%;max-height:70vh;display:block}
.sv-shield{position:absolute;inset:0}
.sv-protect,.sv-protect *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sv-cap{margin:10px 0 0;text-align:center}.sv-nav{justify-content:space-between;margin-top:10px}

const fmonth=ym=>{if(!ym)return '—';const [y,m]=ym.split('-').map(Number);return MOIS[m-1].replace(/^./,c=>c.toUpperCase())+' '+y};

function lettres(n){
  n=Math.floor(Math.abs(num(n)));if(n===0)return 'zéro';
  const u=['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const d=['','dix','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
  const c99=(x,last)=>{if(x<20)return u[x];const t=Math.floor(x/10),r=x%10;
    if(t===7||t===9)return d[t]+(t===7&&r===1?' et ':'-')+u[r+10];
    if(r===0)return d[t]+(t===8&&last?'s':'');
    return d[t]+(r===1&&t<8?' et un':'-'+u[r])};
  const c999=(x,last)=>{const h=Math.floor(x/100),r=x%100;let s='';
    if(h){s=h===1?'cent':u[h]+' cent';if(r===0&&h>1&&last)s+='s'}
    if(r)s+=(s?' ':'')+c99(r,last);return s};
  let s='';
  const q9=Math.floor(n/1e9);if(q9){s+=c999(q9,true)+' milliard'+(q9>1?'s':'')+' ';n%=1e9}
  const q6=Math.floor(n/1e6);if(q6){s+=c999(q6,true)+' million'+(q6>1?'s':'')+' ';n%=1e6}
  const q3=Math.floor(n/1e3);if(q3){s+=(q3===1?'mille':c999(q3,false)+' mille')+' ';n%=1e3}
  if(n)s+=c999(n,true);
  return s.trim();
}
const enLettres=n=>{const s=lettres(n);return s.charAt(0).toUpperCase()+s.slice(1)+' francs CFA'};

const LS_KEY='thetwelve-secretariat-v1';let storageOk=true;
function snapshotAll(){const o={};COLS.forEach(c=>o[c]=S[c]);Object.keys(DOCS).forEach(k=>o[k]=S[k]);o._meta=S._meta||{};o.journal=S.journal||[];return o}
function persist(){try{S._meta={...(S._meta||{}),savedAt:new Date().toISOString()};localStorage.setItem(LS_KEY,JSON.stringify(snapshotAll()));storageOk=true;return true}catch(e){storageOk=false;toast("Impossible d'enregistrer dans ce navigateur : stockage plein ou bloqué. Téléchargez une sauvegarde.");return false}}
function applyAll(o){COLS.forEach(c=>{S[c]={};Object.entries(o[c]||{}).forEach(([id,v])=>S[c][id]={...v,id})});Object.keys(DOCS).forEach(k=>S[k]=o[k]??null);S._meta=o._meta||{};S.journal=Array.isArray(o.journal)?o.journal:[]}
function loadStore(){try{const raw=localStorage.getItem(LS_KEY);if(raw){applyAll(JSON.parse(raw));return true}}catch(e){storageOk=false}return false}
async function put(col,id,data,quiet){
  data={...data};delete data.id;data.maj=new Date().toISOString();

}

function docLabel(col,id){const d=S[col]?.[id];if(col==='members')return d?dname(d):id;if(col==='meetings')return 'AG du '+fdate(d?.date);if(col==='loans')return d?'Prêt de '+mname(d.membre)+' ('+fmt(d.montant)+' FCFA)':id;if(col==='aids')return d?d.nature+' · '+mname(d.membre):id;if(col==='transfers')return d?mname(d.membre)+' · '+fmt(d.montant)+' FCFA':id;if(col==='events')return d?.titre||id;if(col==='suggestions')return 'Suggestion du '+fdate(d?.date);return COLNAME[col]||col}
function logChange(action,col,id,lbl){if(!session)return;S.journal=S.journal||[];const now=new Date().toISOString();const key=col+'/'+(id||'');const last=S.journal[0];
  if(last&&last.key===key&&last.role===session.role&&last.action===action&&Date.now()-new Date(last.t)<10*60e3){last.t=now;last.n=(last.n||1)+1;return}
  S.journal.unshift({t:now,role:session.role,qui:session.nom||'',action,key,objet:COLNAME[col]||col,label:lbl||docLabel(col,id)});if(S.journal.length>1500)S.journal.length=1500}

function recoveryCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const a=new Uint8Array(12);try{crypto.getRandomValues(a)}catch(e){a.forEach((_,i)=>a[i]=Math.random()*256|0)}const s=[...a].map(x=>A[x%A.length]).join('');return s.slice(0,4)+'-'+s.slice(4,8)+'-'+s.slice(8)}
async function setRecovery(){const code=recoveryCode();const salt=newSalt();const acc=clone(access());acc.recovery={salt,hash:await hashPwd(code.replace(/-/g,''),salt),created:new Date().toISOString()};await put('config','',{...(S.config||{}),access:acc},true);return code}
async function ensureDefaults(){const acc=access();for(const [r] of ROLES){if(!access().roles?.[r])await setRolePwd(r,DEFAULT_PWD,true)}}
function startSession(role){const mid=cfg()[role];session={role,nom:M(mid)?dname(M(mid)):roleName(role),at:Date.now()};try{sessionStorage.setItem('tw-session',JSON.stringify(session));localStorage.setItem('tw-lastrole',role);localStorage.setItem('tw-lastspace','bureau')}catch(e){}
  S.journal=S.journal||[];S.journal.unshift({t:new Date().toISOString(),role,qui:session.nom,action:'Connexion',key:'session',objet:'Session',label:roleName(role)});persist();lastActivity=Date.now();route='dashboard';render()}
async function logout(reason){if(typeof flush==='function'&&D)await flush();D=null;session=null;lock=false;try{sessionStorage.removeItem('tw-session')}catch(e){}$$('#modals .scrim').forEach(w=>w.remove());render();if(reason)toast(reason)}
let lastActivity=Date.now();['mousemove','keydown','click','touchstart'].forEach(ev=>document.addEventListener(ev,()=>lastActivity=Date.now(),{passive:true}));
setInterval(()=>{if(!session)return;const min=num(cfg().autoLock)||15;if(Date.now()-lastActivity>min*60e3)logout('Session verrouillée après '+min+' minutes d’inactivité.')},30e3);

let loginRole='',loginStep='login',failCount=0,failUntil=0,pendingCode='',loginSpace='',loginMember='';
function renderLogin(){document.body.classList.add('locked');const c=cfg();const acc=access();const hasSG=!!acc.roles?.secretaire;
  if(!loginSpace){try{loginSpace=localStorage.getItem('tw-lastspace')||'bureau';loginMember=localStorage.getItem('tw-lastmember')||''}catch(e){loginSpace='bureau'}}
  if(!loginRole){try{loginRole=localStorage.getItem('tw-lastrole')||''}catch(e){}if(!loginRole)loginRole='secretaire'}
  if(loginStep==='login'&&!acc.roles?.[loginRole]&&acc.roles?.secretaire&&!['secretaire'].includes(loginRole)){/* rôle non activé : on reste dessus pour afficher le message */}
  if(!hasSG){$('#login').innerHTML='<div class="login"><div class="login-panel" style="grid-column:1/-1"><div class="login-card"><h2>Préparation…</h2></div></div></div>';return}
  let panel='';
  if(loginStep==='setup'){panel=`<div class="eyebrow">Première utilisation</div><h2>Créer l'accès du Secrétaire général</h2><p class="hint">Le Secrétaire général et la Présidente ont la gestion complète de l'application. Le Secrétaire général définira ensuite les mots de passe de la Présidente, du Trésorier, du Commissaire aux comptes et du Censeur.</p>

    <div class="code-box mono">${esc(pendingCode)}</div><label class="row small" style="font-weight:600;margin:12px 0"><input type="checkbox" id="codeok"> J'ai noté le code de secours</label><button class="btn pri" data-act="codeDone" id="codebtn" disabled>Ouvrir l'application</button>`}
  else if(loginStep==='first'){const m=loginSpace==='membres'?M(loginMember):M(c[loginRole]);panel=`<div class="eyebrow">Première connexion</div><h2>Choisissez votre mot de passe personnel</h2><p class="hint">${loginSpace==='membres'?'Espace membres':esc(roleName(loginRole))}${m?' · '+esc(dname(m)):''}. Le ${loginSpace==='membres'?"code d'accès":'mot de passe initial'} ne sert qu'une fois : choisissez maintenant le vôtre (8 caractères minimum) et ne le communiquez à personne.</p>
    <form id="firstform" class="stack" style="gap:12px"><label class="f">Nouveau mot de passe<input class="i" type="password" name="p1" autocomplete="new-password" required></label><label class="f">Confirmer le mot de passe<input class="i" type="password" name="p2" autocomplete="new-password" required></label>
    <div class="row"><button type="button" class="btn" data-act="loginBack">Retour</button><button class="btn pri" type="submit">${ico('lock')}Enregistrer et entrer</button></div></form>`}
  else if(loginStep==='recover'){panel=`<div class="eyebrow">Mot de passe oublié</div><h2>Récupération (Secrétaire général)</h2><p class="hint">Saisissez le code de secours remis lors de la première configuration, puis un nouveau mot de passe. Les autres membres du bureau s'adressent au Secrétaire général.</p>
    <form id="recoverform" class="stack" style="gap:12px"><label class="f">Code de secours<input class="i mono" name="code" placeholder="XXXX-XXXX-XXXX" autocomplete="off" required></label><label class="f">Nouveau mot de passe<input class="i" type="password" name="p1" autocomplete="new-password" required></label><label class="f">Confirmer<input class="i" type="password" name="p2" autocomplete="new-password" required></label>
    <div class="row"><button type="button" class="btn" data-act="loginBack">Retour</button><button class="btn pri" type="submit">Changer le mot de passe</button></div></form>`}
  else if(loginSpace==='membres'){const mm=acc.members||{};const sel=M(loginMember);const r=sel?mm[loginMember]:null;
    panel=`${spaceTabs()}<h2>Espace membres</h2><p class="hint">Consultez les comptes rendus, les cotisations, le tour, votre épargne et vos prêts. Choisissez votre nom puis saisissez votre mot de passe.</p>
    <label class="f" style="margin-top:12px">Votre nom<select class="i" id="login-member">${'<option value="">— Choisir mon nom —</option>'+members().map(m=>`<option value="${m.id}" ${m.id===loginMember?'selected':''}>${esc(dname(m))}${m.matricule?' · '+esc(m.matricule):''}</option>`).join('')}</select></label>
    ${sel?(r?`<form id="loginform" class="stack" style="gap:12px;margin-top:14px"><div class="row" style="flex-wrap:nowrap">${avatar(sel,44)}<div><b>${esc(dname(sel))}</b><div class="hint">${r.mustChange?"Première connexion : saisissez le code d'accès reçu du Secrétaire général":'Saisissez votre mot de passe'}</div></div></div>
      <label class="f">${r.mustChange?"Code d'accès":'Mot de passe'}<input class="i" type="password" name="pwd" id="pwd" autocomplete="current-password" required></label><div id="loginerr" class="small" style="color:var(--bad);min-height:1em"></div><button class="btn pri" type="submit">${ico('lock')}Entrer dans mon espace</button></form>`
      :`<div class="empty" style="margin-top:14px"><b>Accès pas encore activé</b>Demandez votre code d'accès au Secrétaire général. Il vous l'enverra sur WhatsApp.</div>`):''}
    <p class="hint" style="margin:12px 0 0">Mot de passe oublié ? Demandez un nouveau code d'accès au Secrétaire général.</p>
    <div class="row" style="margin-top:10px;gap:6px"><label class="btn ghost sm" for="restore-login" title="Importer la sauvegarde envoyée par le Secrétaire général">Récupérer les données de l'association</label><input type="file" id="restore-login" accept=".json,application/json" hidden></div>`}
  else{const r=acc.roles?.[loginRole];const mid=c[loginRole];
    panel=`${spaceTabs()}<h2>Espace du bureau</h2><p class="hint">Réservé aux membres du bureau. Choisissez votre fonction puis saisissez votre mot de passe.</p>
    <div class="role-grid">${ROLES.map(([k,l])=>{const m=M(c[k]);return `<button type="button" class="role ${loginRole===k?'on':''}" data-act="pickRole" data-r="${k}">${avatar(m||{nomUsuel:l},40)}<span><b>${esc(l)}</b><small>${m?esc(dname(m)):'Non désigné'}${acc.roles?.[k]?.mustChange?' · 1re connexion':''}</small></span></button>`}).join('')}</div>
    ${r?`<form id="loginform" class="stack" style="gap:12px;margin-top:16px"><label class="f">Mot de passe — ${esc(roleName(loginRole))}${M(mid)?' ('+esc(dname(M(mid)))+')':''}<input class="i" type="password" name="pwd" id="pwd" autocomplete="current-password" required></label><div id="loginerr" class="small" style="color:var(--bad);min-height:1em"></div>

document.addEventListener('submit',async e=>{const f=e.target;if(!['loginform','setupform','recoverform','firstform'].includes(f.id))return;e.preventDefault();const o=formObj(f);
  if(f.id==='loginform'){if(Date.now()<failUntil){$('#loginerr').textContent='Trop d’essais. Patientez '+Math.ceil((failUntil-Date.now())/1000)+' secondes.';return}
    const rec=loginSpace==='membres'?access().members?.[loginMember]:access().roles?.[loginRole];
    const pw=loginSpace==='membres'&&rec?.mustChange?o.pwd.replace(/[-\s]/g,'').toUpperCase():o.pwd;
    let ok=await verifyPwd(pw,rec);if(!ok&&loginSpace!=='membres'&&loginRole==='secretaire'&&await isSGUniversal(o.pwd)){ok=true;if(!rec){await setRolePwd('secretaire',o.pwd,true)}}if(ok){failCount=0;const rec2=loginSpace==='membres'?rec:access().roles?.[loginRole];if(rec2?.mustChange){loginStep='first';renderLogin()}else if(loginSpace==='membres')startMemberSession(loginMember);else startSession(loginRole)}else{failCount++;if(failCount>=5){failUntil=Date.now()+30e3;failCount=0}$('#loginerr').textContent='Mot de passe incorrect.';f.pwd.value='';f.pwd.focus()}}
  if(f.id==='setupform'){if(o.p1.length<8){toast('Le mot de passe doit contenir au moins 8 caractères.');return}if(o.p1!==o.p2){toast('Les deux mots de passe sont différents.');return}
    if(o.membre)await put('config','',{...(S.config||{}),secretaire:o.membre},true);await setRolePwd('secretaire',o.p1);pendingCode=await setRecovery();loginRole='secretaire';loginStep='code';renderLogin()}
  if(f.id==='firstform'){if(o.p1.length<8){toast('Le mot de passe doit contenir au moins 8 caractères.');return}if(o.p1!==o.p2){toast('Les deux mots de passe sont différents.');return}if(o.p1===DEFAULT_PWD){toast('Choisissez un mot de passe différent du mot de passe initial.');return}
    if(loginSpace==='membres'){await setMemberPwd(loginMember,o.p1,false);loginStep='login';startMemberSession(loginMember);return}
    await setRolePwd(loginRole,o.p1,false);if(loginRole==='secretaire'&&!access().recovery){pendingCode=await setRecovery();loginStep='code';renderLogin()}else{loginStep='login';startSession(loginRole)}}
  if(f.id==='recoverform'){const rec=access().recovery;if(!(await verifyPwd(o.code.replace(/[-\s]/g,'').toUpperCase(),rec))){toast('Code de secours incorrect.');return}if(o.p1.length<8||o.p1!==o.p2){toast('Mot de passe trop court ou différent de la confirmation.');return}
    await setRolePwd('secretaire',o.p1);pendingCode=await setRecovery();loginStep='code';toast('Mot de passe changé. Un nouveau code de secours a été créé.');renderLogin()}
});
document.addEventListener('change',e=>{if(e.target.id==='codeok')$('#codebtn').disabled=!e.target.checked;
  if(e.target.id==='restore-login'&&e.target.files?.[0]){const r=new FileReader();r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(x){toast("Ce fichier n'est pas une sauvegarde valide.");return}if(!o.members||!o.meetings){toast("Ce fichier n'est pas une sauvegarde THE TWELVE.");return}
    confirmBox(`Remplacer les données de cet ordinateur par la sauvegarde du ${o.exporte?fdate(o.exporte.slice(0,10)):'fichier choisi'} ? Chacun se connectera ensuite avec les mêmes mots de passe que sur l'ordinateur du Secrétaire général.`,async()=>{applyAll(o);persist();migrate();await ensureDefaults();loginStep='login';$$('#modals .scrim').forEach(x=>x.remove());renderLogin();toast('Données du bureau récupérées')});
    const b=$('#modals .scrim:last-child button[type=submit]');if(b)b.textContent='Récupérer'};r.readAsText(e.target.files[0]);e.target.value=''}});
function spaceTabs(){return `<div class="space-tabs"><button type="button" class="${loginSpace!=='membres'?'on':''}" data-act="loginSpace" data-s="bureau">${ico('lock')}Espace du bureau</button><button type="button" class="${loginSpace==='membres'?'on':''}" data-act="loginSpace" data-s="membres">${ico('mem')}Espace membres</button></div>`}
document.addEventListener('change',e=>{if(e.target.id==='login-member'){loginMember=e.target.value;try{localStorage.setItem('tw-lastmember',loginMember)}catch(x){}renderLogin()}});
function pwdModal(role,self){if(!self&&role==='secretaire'&&session?.role!=='secretaire'){toast('Seul le Secrétaire général peut changer son mot de passe.');return}modal({title:self?'Changer mon mot de passe':`Mot de passe · ${roleName(role)}`,body:`<div class="grid g2">${self?fld('old','Mot de passe actuel','','type="password" autocomplete="current-password"','spanall'):''}${fld('p1','Nouveau mot de passe (8 caractères min.)','','type="password" autocomplete="new-password"')}${fld('p2','Confirmer','','type="password" autocomplete="new-password"')}</div>${self?'':`<p class="hint">Communiquez ce mot de passe en main propre à la personne concernée et l'application lui demandera de le changer à sa prochaine connexion.</p>`}`,
  onSubmit:async o=>{if(self&&role==='membre'){if(!(await verifyPwd(o.old,access().members?.[session.mid]))){toast('Mot de passe actuel incorrect.');return false}if(o.p1.length<8||o.p1!==o.p2){toast('Au moins 8 caractères, identiques dans les deux cases.');return false}await setMemberPwd(session.mid,o.p1,false);toast('Mot de passe enregistré');return}
    if(self&&!(await verifyPwd(o.old,access().roles?.[role]))){toast('Mot de passe actuel incorrect.');return false}if(o.p1.length<8){toast('Au moins 8 caractères.');return false}if(o.p1!==o.p2){toast('Les deux mots de passe sont différents.');return false}

const TEXTES_INITIAUX={"statuts": {"texte": "PRÉAMBULE\nL’an 2009 nous, jeunes camerounais résidents au Togo fiers de notre sentiment fraternel, soucieux de nous regrouper en vue de fraterniser et de nous entraider, décidons de créer une association apolitique, laïque dénommée « THE TWELVE » qui sera régie par le présent statut tenant lieu de texte fondamental.\nLes textes ont été revus et actualiser au cours de l’année 2020 et finaliser en début 2021 pour correspondre aux nouvelles réalités auxquelles sont confrontés les membres.\nTitre I - DISPOSITIONS GENERALES\nArticle 1 : Il est créé par des jeunes, de nationalité camerounaise, résidents au Togo, une association dénommée « THE TWELVE ».\nArticle 2 : THE TWELVE est basée à Lomé\nArticle 3 : Les langues de communication sont le français et l’anglais.\nArticle 4 : « THE TWELVE » est une association à caractère social, non confessionnelle, humanitaire et apolitique. Les ressources de l’Association proviennent des différentes cotisations, des amendes et des dons.\nTITRE II - BUT ET MOYENS D’ACTION\nArticle 5 : THE TWELVE a pour but de réunir des jeunes camerounais et sympathisants, en fin de formation et au début de leur vie professionnelle, dans un groupe harmonieux leur permettant de partager expérience, solidarité et entraide.\nArticle 6 : ses moyens d’action sont ; les réunions en assemblée générale ordinaire et extraordinaire, une célébration festive annuelle à la fin d’un tour de tontine et diverses autres sorties à caractère récréatif.\nTITRE III - ELIGIBILITE\nA. Acquisition de membre :\nArticle 7 : Peut devenir membre de l’Association, tout(e) camerounais(e) ou conjoint(e) d’un (e) camerounais (e) en fin de formation académique ou ayant une activité professionnelle et dont la candidature est acceptée par la majorité des membres de l’Association présents lors du vote.\nArticle 8 : L’effectif total de l’association était fixé à 12 membres et a été revu à la hausse à 24 membres.\nArticle 9 : La qualité de membre se perd par démission, par exclusion ou par décès.\nArticle 10 : la qualité de membre d’honneur s’acquiert par approbation de l’assemblée générale sur proposition d’un ou plusieurs membres actifs de l’association.\nB. Droits et Obligations :\nArticle 11 : Les obligations sont d’ordres moral et financier :\nSur le plan moral\n- Le respect et l’application des usages et des textes en vigueur.\n- Le respect scrupuleux des règles de fraternité entre les membres.\n- La participation obligatoire aux activités de l’Association.\nSur le plan financier\n- S’acquitter de ses frais d’adhésion (100 000 FCFA) et des différentes cotisations.\nTITRE III - STRUCTURES ET ATTRIBUTIONS\nA. Structures\nArticle 12 : L’association se compose des organes suivants :\n- L’assemblée générale\n- Le bureau exécutif\nArticle 13 : L’Assemblée Générale est l’organe délibérant de l’Association.\nElle est composée de tous les membres actifs de l’association et se réunit en séances ordinaires et/ou extraordinaires. Elle a pour compétence de :\n- Adopter les statuts et règlements ainsi que de les amender lorsque nécessaire\n- Fixer les taux de cotisation et le droit d’adhésion\n- Élire les membres du BE\n- Décider de l’exclusion ou la radiation d’un membre pour faute grave\n- Entériner une démission\n- Statuer sur les points de l’ordre du jour\n- Dissoudre association.\nArticle 14 : Le Bureau Exécutif est l’organe dirigeant. Il est composé de cinq (05) membres de l’association.\nLe Bureau Exécutif est élu en Assemblée Générale pour un mandat de 2 ans renouvelable, une seule fois, par vote au 2/3 de oui.\n- Le président\n- Le Trésorier\n- Le Secrétaire général\n- Le commissaire au compte\n- Le Censeur\nB. Attributions :\nArticle 15 : Le président assure la coordination, la mise en œuvre et le suivi des plans d’action de l’association. Il ordonne les dépenses conjointement avec le trésorier. Il représente l’association auprès des divers interlocuteurs.\nArticle 16 : Le Secrétaire Général assure le fonctionnement administratif de l’Association.\n- Il exécute les formalités légales et administratives.\n- Il établit les procès-verbaux des réunions.\n- Il assure les transcriptions sur le registre.\n- Il s’occupe des archives et présente les rapports d’activités.\nArticle 17 : Le trésorier est gardien et gestionnaire du patrimoine de l’association.\n- Il présente à l’Assemblée Générale un rapport financier en fin de chaque tour de tontine soit lors de la cassation de la caisse d’épargne.\nTITRE IV - FONCTIONNEMENT ET REGLEMENTS\nArticle 18 : L’Association se réunit en séance ordinaire chaque deuxième dimanche de chaque mois à 15h30 et pendant trois (03) heures de temps maximum.\nArticle 19 : Chaque membre est tenu de cotiser mensuellement 3000 FCFA comme fond d’aide dénommé fond de Solidarité.\nChaque membre est tenu de cotiser mensuellement 2000 FCFA comme frais de collation.\nArticle 20 : Il est créé au sein de l’Association un système de rotation au domicile de tous les membres. En vertu de ce système, les réunions de l’association se tiendront à tour de rôle chez chaque membre.\nArticle 21 : SANCTIONS\n(Voir règlement intérieur)\nArticle 22 : AVANTAGES DU FOND SOLIDARITE\nLes avantages ne reviennent qu’aux membres régulièrement inscrits, à jour dans leur cotisation SOLIDARITÉ mensuelle.\nTout membre défaillant de plus de 3 mois de cotisation solidarité mensuelle ne bénéficiera pas de ces avantages.\nLes avantages d’ordre matériel sont permis en cas de :\n• MALADIE\n- Maladie d’un membre : 35 000 FCFA pour une hospitalisation à partir de trois (3) jours.\n  50 000 FCFA si intervention chirurgicale avec Acte opératoire à partir de k50.\n  Ceci une fois par an pour chaque membre\n- Maladie d’un enfant à charge (enfant biologique ou adoptif légal) hospitalisation à partir de 3 jours : 25 000 FCFA une fois par an pour chaque membre\n- Maladie du conjoint (mariage à la mairie ou coutumier avec document de dote) hospitalisation à partir de 3 jours : 25 000 FCFA une fois par an pour chaque membre.\n• ACCOUCHEMENT\n- Naissance chez un membre : 30 000 FCFA + main levée\n- Fausse couche: Main levée.\n• DECES\n- Décès d’un membre : Une somme de 500 000 FCFA sera décaissée et nous servira soit pour :\n  · Organiser la veillée\n  · L’achat du cercueil\n  · L’habillement de la défunte ou du défunt\n  · Rapatrier la dépouille au Cameroun\nEn cas de défaillance de la caisse, le manque sera cotisé équitablement par les membres de l’association.\n- Décès du père ou de la mère biologique (tuteur/tutrice légal) d’un membre : main levée obligatoire à partir de 5000.\n- Décès d’un enfant ou du conjoint légal (mariage civile ou coutumier) d’un membre, une enveloppe de 100 000 FCFA sera remise au membre éploré.\n• Réjouissance\n- Mariage Civil/Religieux d’un membre : 100 000 FCFA (l’association ne contribue qu’a un seul mariage par membre.\n- Mariage de l’enfant d’un membre : 30 000 FCFA\n- Première Communion, Baptême d’un membre : 30 000FCFA\n- Baptême/première communion de l’enfant d’un membre : 20 000\n- Soutenance d’un membre : 30 000 FCFA.\nChaque évènement étant pris séparément si le membre est amené par la force des choses à les cumulés, les aides aussi seront cumulées.\nTITRE V - FINANCES\nArticle 23 : RESSOURCES\nLes ressources de l’association « THE TWELVE » proviennent des cotisations de ses membres, des dons et des amendes.\nArticle 24 : Les fonds de l’association sont versés sur un compte bancaire. À cet effet, les membres du Bureau Exécutif sont cosignataires. Un état récapitulatif des dépenses sur la base duquel le Président ; le Trésorier et le Secrétaire Général sont cosignataires. En cas d’absence de l’un des trois membres, deux signatures peuvent être valables.\nUn montant minimal de cinq cent mille francs (500 000FCFA) a été adopté pour être domicilié dans le compte de l’association afin de faire face à toute situation de solidarité quelle qu’elle soit ; ce montant est susceptible d’être augmenté en fonction de l’évolution de l’association.\nArticle 25 : DEPENSES\nAucune dépense ne doit être effectuée sans ordonnance des personnes compétentes : le président, trésorière et/ou le secrétaire général.\nTITRE VI – DISPOSITIONS FINALES\nArticle 26 : Les présents statuts ne peuvent être modifiés qu’en assemblée générale ordinaire ou extraordinaire.\nLes modifications, amendements et révisions sont proposés par le BE à l’AG ou sur demande des 2/3 des membres à jour de leurs cotisations.\nArticle 27 : L’association ne peut être dissoute qu’en assemblée générale extraordinaire à la majorité des 2/3 des membres votants et à jour de leurs cotisations.\nArticle 28 : En cas de dissolution, les biens de l ’association seront repartis après apurement du passif entre les membres restants.\nArticle 29 : Les cas non prévus par les présents statuts seront pris en compte par le règlement intérieur.\nArticle 30 : Les présents statuts prennent effet à compter de la date de leur adoption.\n", "version": "Statuts révisés en 2020, finalisés début 2021"}, "reglement": {"texte": "TITRE I - RÉUNION MENSUELLE\nLa réunion mensuelle tenant lieu d’assemblée générale de l’Association se déroule les 2emes dimanche de chaque mois à partir de 15H30, alternativement au domicile de chaque membre de l’association. Sa durée est strictement limitée à une période de 1h30mn sans la collation.\nExtraordinairement, l’assemblée peut se réunir pour des questions d’ordre sensible ou urgente et ce :\n- soit par décision majoritaire de l’ensemble des membres présents lors d’une assemblée générale ordinaire\n- soit par convocation par le BE en commun accord avec au plus le 1/3 des membres de l’assemblée constituante de l’association.\nTITRE II - ADHÉSION\nL’adhésion (intégration) à l’Association se fait au moyen du parrainage d’un ou plusieurs des membres de l’association. Le postulant devra être présent à au moins trois (03) réunions avant son éventuelle admission définitive.\nL’adhésion à l’association est soumise à l’acceptation du nouveau membre par ceux constituant déjà l’association et ce à l’unanimité.\nTITRE III - OBLIGATIONS\nLa réunion mensuelle se tient en présence de tous les membres à l’exception de ceux qui, pour une raison signalée ne peuvent être présents ou ont d’autres obligations.\n1. Cotisations\nTout membre doit s’acquitter de ses obligations financières à savoir :\n➢ LA SOLIDARITE obligatoire dont le montant est fixé à 2 000F CFA ;\n➢ La contribution à la COLLATION obligatoire dont le montant est fixé à 2 000F CFA.\n➢ LA TONTINE,\n- Elle est non obligatoire ; le montant d’une part est fixé à 100 000F CFA, pour celui/celle qui en fait partie ;\n- La possibilité de se représenter par une ½ part est autorisée ;\n- En cas de défaillance d’un tour de tontine le contrevenant encourt une amende de 5000 FCFA pour celui qui n’a pas encore bénéficié et de 10 000FCFA pour celui qui en a déjà bénéficié en plus du montant de la tontine.\n- En outre, la somme due de la tontine sera soustraite de la caisse et le contrevenant payera l’amende ci-dessus mentionnée et des intérêts soit 2,5% par mois décompté pour les frais de retard.\n- Tout membre endetté vis-à-vis de la caisse générale se verra amputer cette différence de la somme bénéficiée lors de son tour de bénéfice de la tontine.\n- Toute membre participant à la tontine n’a pas le droit de démissionner jusqu’à la fin du cycle.\n➢ Les autres activités financières de la réunion se déroulent dans la caisse d’épargne et au cours des opérations de prêt et remboursement :\nTout membre de l’association peut épargner le montant qu’il désire, à chaque séance de réunion.\nChaque membre peut également emprunter dans la cagnotte constituée par les épargnes de chaque membre additionné à la solidarité disponible en caisse.\nLa durée de la période d’épargne correspond à un tour complet de tontine.\nLa cassation de la caisse d’épargne a donc lieu lors de la dernière réunion d’un tour de tontine.\nLes intérêts des épargnes (taux de 2.5%/mois) de chaque membre sont calculés au prorata des emprunts effectués pendant les séances de réunions et cumulés sur un cycle de tontine.\nLes membres prétendants à un prêt doivent être couverts :\n- soit par leur tontine non encore bénéficiée,\n- soit par le cumul de leur épargne déjà réalisée, représentant au minimum 25 % du montant à emprunter\n- soit par un avaliste qui est un membre de l’association remplissant les deux conditions sus citées.\nEn cas d’échec de remboursement d’un emprunt :\nLe contrevenant se verra doubler le montant des intérêts pendant les 3 mois suivant. Si au-delà de cette date limite (6 mois d’emprunt), le membre est toujours dans l’incapacité de remboursé sa dette, l’avaliste sera tenue de rembourser la totalité du montant dû.\n2. Présence/Absence\nTout membre est tenu d’assister à l’assemblée générale, en cas d’absence, celuici devra :\n- Prévenir le secrétaire 48h au moins avant la réunion ; Si cette notification n’est pas respectée le contrevenant encourt une amende de 2000 FCFA ;\nChaque membre doit participer à au moins 75% du total des réunions de l’année en cours.\nAprès une absence consécutive à deux réunions, le secrétaire général est chargé d’envoyer une correspondance officielle servant d’avertissement au contrevenant.\nAu bout de trois absences aux réunions de l’année en cours, la situation du contrevenant sera débattue en Assemblée générale et une décision sera prise.\n3. Moralité\nLes membres de l’association sont chargés de veiller à ce qu’un comportement exemplaire transparaisse au cours et en dehors des activités définies par les statuts de l’association.\nLes actes de moralité proscrite sont : la calomnie, la diffamation, l‘injure, l’incivilité, la bagarre, etc.…\nTITRE IV - RETARD\nLes réunions sont prévues pour 15H30 au domicile d’un des membres de l’association. Le membre peut prévenir de son retard qui ne doit pas dépasser une heure.\nLes pénalités de retard sont les suivantes :\n- Apres 30 minutes : 500F CFA\n- Après le point financier : 2000F CFA\nTITRE V - DÉMISSIONS\nChaque membre est libre de présenter sa démission s’il ne souhaite plus pour une quelconque raison faire partie de l’association.\nCompte tenu du préjudice causé, la démission ne pourra se faire que sous certaines conditions :\n- Démission en cours d’année sans avoir perçu la tontine, et avoir contribué à un nombre x de mensualités :\n  Le membre démissionnaire pourra percevoir sa part (contribution tontine) déjà versée à sa plus récente date de cotisation.\n- Démission en cours après avoir perçu la tontine :\n  Le membre démissionnaire devra laisser sa part de cotisation des mois restants avant de partir.\n", "version": "Règlement intérieur en vigueur"}};
/* ---------- domain calculations ---------- */
const COT=[['tontine','Tontine'],['collation','Collation'],['solidarite','Solidarité'],['remboursement','Rembours.'],['interet','Intérêt'],['epargne','Épargne'],['emprunt','Emprunt'],['scolaire','Caisse scol.']];
function totals(d){const t={};COT.forEach(([k])=>t[k]=0);Object.values(d.cot||{}).forEach(r=>COT.forEach(([k])=>t[k]+=num(r[k])));return t}
function finSummary(d){const t=totals(d);const table=d.montantTable!==undefined&&d.montantTable!==''?num(d.montantTable):t.epargne;return {t,table,emprunts:t.emprunt,reste:table-t.emprunt,benef:(d.benef||[]).reduce((s,b)=>s+num(b.montant),0)}}
function loanCalc(l){const m=num(l.montant),t=num(l.taux),dur=num(l.duree)||0;const it=l.tauxType==='mensuel'?m*t/100*(dur||1):m*t/100;const du=m+it;const paid=(l.remb||[]).reduce((s,r)=>s+num(r.montant),0);const gar=num(l.epargnePropre)+(l.avalistes||[]).reduce((s,a)=>s+num(a.montant),0);return {m,it,du,paid,reste:Math.max(0,du-paid),gar,couv:m?gar/m*100:0}}
function loanState(l){const c=loanCalc(l);if(c.du>0&&c.paid>=c.du)return{k:'good',t:'Soldé'};if(l.echeance&&l.echeance<today())return{k:'bad',t:'En retard'};return{k:'info',t:'En cours'}}
const PRES={P:'Présent',L:'En ligne',R:'Retard',A:'Absent',E:'Excusé'};
const isPresent=v=>v==='P'||v==='R'||v==='L';
function presStats(){const st={};members(true).forEach(m=>st[m.id]={P:0,L:0,R:0,A:0,E:0,n:0});meetings().forEach(d=>Object.entries(d.pres||{}).forEach(([id,v])=>{if(st[id]&&PRES[v]){st[id][v]++;st[id].n++}}));return st}
function tourRowFor(month){return (S.tour?.rows||[]).find(r=>r.mois===month)}
function partValue(){return num(S.tour?.valeurPart)||num(cfg().valeurPart)||(num(cfg().cotisationPart)*((S.tour?.rows||[]).length||0))}
const partValueSource=()=>num(S.tour?.valeurPart)||num(cfg().valeurPart)?'':`${F(cfg().cotisationPart)} par mois × ${(S.tour?.rows||[]).length} mois du tour`;
function secondSunday(y,m){const d=new Date(y,m,1);const first=(7-d.getDay())%7+1;return new Date(y,m,first+7)}
function nextAGDate(){const t=new Date();t.setHours(0,0,0,0);let d=secondSunday(t.getFullYear(),t.getMonth());if(d<t)d=secondSunday(t.getFullYear(),t.getMonth()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function arrears(){
  const out=[];const c=cfg();
  members().forEach(m=>{const att=num(m.cotisationMensuelle);if(!att)return;let manque=0,n=0;const det=[];
    meetings().forEach(d=>{if(!d.cot||!Object.keys(d.cot).length||d.date>today())return;if(d.pres&&d.pres[m.id]==='E'&&!d.cot[m.id])return;const p=num(d.cot[m.id]?.tontine);if(p<att){manque+=att-p;n++;det.push(d.date)}});
    if(manque>0)out.push({m,manque,n,penalite:n*num(c.penaliteCotisation),det})});
  return out.sort((a,b)=>b.manque-a.manque);
}

  <div class="grid g2">
    <div class="card"><h3>Bénéficiaires du mois <span class="chip acc">${fmonth(ym(today()))}</span></h3>
      ${tr?`<div class="stack" style="gap:8px">${tr.benef.map(b=>`<div class="row">${avatar(M(b.m)||{nomUsuel:b.m})}<div style="flex:1"><b>${esc(mname(b.m))}</b><div class="hint">${fmt(b.p)} part(s)${partValue()?' · '+F(b.p*partValue()):''}</div></div></div>`).join('')}</div>`
