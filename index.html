TABS.jour=()=>{const c=D.cassation||{};const cs=cassCalc(c);const P=D.points||[];
 return `<div class="stack"><div class="card"><h3>Suivi des points de l'ordre du jour <span class="row"><button class="btn sm" data-act="carryPrev">Reprendre les points non résolus</button><button class="btn sm" data-act="addPoint">${ico('plus')}Point</button></span></h3>
  <p class="hint" style="margin-top:0">Indiquez pour chaque point s'il est résolu. Les points « Non résolu » ou « Reporté » seront remis automatiquement à l'ordre du jour de la prochaine AG.</p>
  ${P.length?`<div class="tw"><table class="t"><thead><tr><th>Point</th><th>Statut</th><th>Décision / suite à donner</th><th></th></tr></thead><tbody>${P.map((p,i)=>`<tr><td style="min-width:220px"><input class="i" data-k="points.${i}.titre" value="${esc(p.titre)}">${p.reporte&&p.origine?`<div class="hint">Reporté de l'AG du ${fdate(p.origine)}</div>`:''}</td>
  <td><select class="i" data-k="points.${i}.statut" style="width:140px">${opts(['Non résolu','En cours','Reporté','Résolu'],p.statut||'Non résolu')}</select></td><td style="min-width:240px"><input class="i" data-k="points.${i}.suite" value="${esc(p.suite||'')}" placeholder="Décision prise, responsable, échéance…"></td>
  <td><button class="btn ghost sm danger" data-act="rmPoint" data-i="${i}" aria-label="Retirer">${ico('trash')}</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="hint">Aucun point suivi pour cette séance.</div>`}</div><div class="card"><h3>Rapport de la dernière AG <button class="btn sm" data-act="insertPrevCorr">Insérer les corrections du compte rendu précédent</button></h3><textarea class="i" id="f-rapport" data-k="rapport" rows="4">${esc(D.rapport||'')}</textarea></div>
 <div class="card"><h3>Point du jour ${aiBtn('jour')}</h3><textarea class="i" id="f-jour" data-k="jour" rows="8" placeholder="Décisions, projets, débats…">${esc(D.jour||'')}</textarea></div>
 <div class="card"><h3>Cassation annuelle <label class="row small" style="font-weight:600"><input type="checkbox" data-k="cassation.actif" ${c.actif?'checked':''}> Inclure dans ce compte rendu</label></h3>
  <div class="grid g3"><label class="f">Année précédente<input class="i" data-k="cassation.a1" value="${esc(c.a1||'')}"></label><label class="f">Épargne principale<input class="i" data-money data-k="cassation.e1" value="${c.e1?fmt(c.e1):''}"></label><label class="f">Intérêts générés<input class="i" data-money data-k="cassation.i1" value="${c.i1?fmt(c.i1):''}"></label>
  <label class="f">Année en cours<input class="i" data-k="cassation.a2" value="${esc(c.a2||'')}"></label><label class="f">Épargne principale<input class="i" data-money data-k="cassation.e2" value="${c.e2?fmt(c.e2):''}"></label><label class="f">Intérêts générés<input class="i" data-money data-k="cassation.i2" value="${c.i2?fmt(c.i2):''}"></label></div>
  <p class="small" id="cass-res">${cs.html}</p>
  <label class="f">Commentaire<textarea class="i" data-k="cassation.note" rows="2">${esc(c.note||'')}</textarea></label></div>
 <div class="card"><h3>Divers ${aiBtn('divers')}</h3><textarea class="i" id="f-divers" data-k="divers" rows="4">${esc(D.divers||'')}</textarea>
  <div class="row" style="margin-top:12px"><label class="row small"><input type="checkbox" data-k="annexCot" ${D.annexCot!==false?'checked':''}> Joindre le tableau récapitulatif des cotisations</label><label class="row small"><input type="checkbox" data-k="annexTour" ${D.annexTour!==false?'checked':''}> Joindre le classement du prochain tour</label></div></div></div>`};
function cassCalc(c){const t1=num(c.e1)+num(c.i1),t2=num(c.e2)+num(c.i2);const p=t1?((t2-t1)/t1*100):0;
 return {t1,t2,p,html:t1||t2?`Total ${esc(c.a1||'N-1')} : <b>${F(t1)}</b> · Total ${esc(c.a2||'N')} : <b>${F(t2)}</b>${t1?` · Progression calculée : <b>${p.toFixed(2).replace('.',',')} %</b>`:''}`:'Saisissez les montants pour calculer la progression.'}}
TABS.corrections=()=>{const C=D.corrections||[];const ok=C.filter(c=>c.applique).length;
 return `<div class="card" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Version du compte rendu</div><h3 style="margin:0">Version n° ${num(D.version)||1}${D.dateCorrection?' · corrigée le '+fdate(D.dateCorrection):''}</h3><p class="hint" style="margin:4px 0 0">${C.length} correction(s) enregistrée(s), ${ok} appliquée(s).</p></div>
 <div class="row"><button class="btn" data-act="newCorr">${ico('plus')}Enregistrer une correction</button><button class="btn pri" data-act="validateCorr" ${C.length?'':'disabled'}>Valider la version corrigée (n° ${(num(D.version)||1)+1})</button></div></div></div>
 <div class="card" style="margin-bottom:16px;background:var(--surface-2)"><b>Comment intégrer les corrections</b><ol class="small" style="margin:6px 0 0 18px;padding:0;color:var(--fg-2)"><li>À la lecture du compte rendu en AG, notez chaque correction demandée (section, auteur, texte initial, texte corrigé).</li><li>Modifiez le texte dans l'onglet concerné (Présences, Nouvelles de famille, Point financier…) puis cochez « Appliquée ».</li><li>Validez la version corrigée : le compte rendu imprimé porte la mention « Version n° 2 corrigée » et la liste des rectificatifs.</li><li>Dans le compte rendu suivant, le bouton « Insérer les corrections du compte rendu précédent » reprend cette liste dans le rapport de la dernière AG.</li></ol></div>
 ${C.length?`<div class="tw"><table class="t"><thead><tr><th>Date</th><th>Section</th><th>Demandé par</th><th>Élément initial</th><th>Correction</th><th>Appliquée</th><th></th></tr></thead><tbody>${C.map((c,i)=>`<tr><td style="white-space:nowrap">${fdate(c.date)}</td><td><span class="chip">${esc(c.section)}</span></td><td>${esc(c.par?mname(c.par):'Bureau')}</td><td class="small" style="min-width:160px">${esc(c.avant||'')}</td><td class="small" style="min-width:200px">${esc(c.apres||'')}</td><td><input type="checkbox" data-k="corrections.${i}.applique" ${c.applique?'checked':''} style="width:18px;height:18px;accent-color:var(--accent)"></td><td style="white-space:nowrap"><button class="btn ghost sm" data-act="editCorr" data-i="${i}" aria-label="Modifier">${ico('edit')}</button><button class="btn ghost sm danger" data-act="rmCorr" data-i="${i}" aria-label="Supprimer">${ico('trash')}</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>Aucune correction</b>Les corrections demandées lors de l'adoption du compte rendu apparaîtront ici.</div>`}`};
TABS.apercu=()=>`<div class="row" style="margin-bottom:12px"><button class="btn pri" data-act="crPdfNow">${ico('pdf')}${window.twelveDesktop?'Générer le PDF':'Imprimer / PDF'}</button><button class="btn" data-act="pdfCot">${ico('pdf')}Tableau des cotisations</button><button class="btn" data-act="pdfPresence">${ico('pdf')}Fiche de présence</button>${(D.benef||[]).map((b,i)=>`<button class="btn sm" data-act="fiche" data-i="${i}">Fiche ${esc(mname(b.m))}</button>`).join('')}</div>
 <div class="paperwrap">${paper(crDoc(D))}</div>`;

/* ---------- cotisations ---------- */
let cotTab='tableau',cotMeet='',cuFrom='',cuTo='';
function cotRows(d){const ids=members().map(m=>m.id);Object.keys(d.cot||{}).forEach(id=>{if(!ids.includes(id)&&COT.some(([k])=>num(d.cot[id][k])))ids.push(id)});return ids.map(id=>[id,(d.cot||{})[id]||{}])}
const CUM=COT.filter(([k])=>k!=='epargne');
function cumul(from,to){const ms=meetings().filter(d=>(!from||d.date>=from)&&(!to||d.date<=to));
  const rows=members(true).map(m=>{const r={m,n:0,ep:0};CUM.forEach(([k])=>r[k]=0);let last='';ms.forEach(d=>{const c=d.cot?.[m.id];if(!c)return;if(COT.some(([k])=>num(c[k])))r.n++;CUM.forEach(([k])=>r[k]+=num(c[k]));if(d.date>last&&c.epargne!==''&&c.epargne!==undefined){last=d.date;r.ep=num(c.epargne)}});return r}).filter(r=>r.n||r.ep);
  const tot={};CUM.forEach(([k])=>tot[k]=rows.reduce((s,r)=>s+r[k],0));tot.ep=rows.reduce((s,r)=>s+r.ep,0);return {from,to,n:ms.length,rows,tot}}
function cuRange(){const y=new Date().getFullYear();return [cuFrom||(meetings().length?meetings()[meetings().length-1].date:y+'-01-01'),cuTo||today()]}
VIEWS.cotisations=()=>{const ms=meetings();const d=S.meetings[cotMeet]||ms[0];if(d)cotMeet=d.id;
 const T=[['tableau','Tableau récapitulatif'],['cumul','Cumul par membre'],['retards','Retards & pénalités'],['fiches','Fiches bénéficiaires']];
 let body='';
 if(cotTab==='tableau'){body=d?(()=>{const s=finSummary(d);const rows=cotRows(d);return `<div class="row" style="margin-bottom:12px"><select class="i" data-act-change="cotMeet" style="width:auto">${ms.map(m=>`<option value="${m.id}" ${m.id===d.id?'selected':''}>AG du ${fdate(m.date)}</option>`).join('')}</select>
  <button class="btn" data-act="newMeeting">${ico('plus')}Nouvelle séance</button><button class="btn" data-act="openMeeting" data-id="${d.id}">${ico('edit')}Ouvrir le compte rendu</button><span style="flex:1"></span><button class="btn" data-act="csvCot">Exporter vers Excel</button><button class="btn pri" data-act="pdfCot">${ico('pdf')}Imprimer le tableau</button></div>
  <div class="kpis"><div class="kpi"><span>Tontine</span><b id="cg-k-tontine">${fmt(s.t.tontine)}</b><small>FCFA</small></div><div class="kpi" style="--c:var(--navy)"><span>Épargne totale</span><b id="cg-k-epargne">${fmt(s.t.epargne)}</b><small>FCFA</small></div><div class="kpi" style="--c:var(--orange)"><span>Emprunts du jour</span><b id="cg-k-emprunt">${fmt(s.t.emprunt)}</b><small>FCFA</small></div><div class="kpi" style="--c:var(--lime)"><span>Reste en caisse</span><b id="cg-k-reste">${fmt(s.reste)}</b><small>FCFA</small></div></div>
  <div class="tw"><table class="t"><thead><tr><th>N°</th><th>Membre</th>${COT.map(([k,l])=>`<th class="n">${l}</th>`).join('')}<th>Mode</th><th>Réf. virement</th></tr></thead><tbody>
  ${rows.map(([id,r],i)=>`<tr><td class="mono muted">${i+1}</td><td style="white-space:nowrap"><b>${esc(mname(id))}</b></td>${COT.map(([k])=>`<td><input class="i cell" inputmode="numeric" data-money data-cg="${k}" data-mid="${id}" value="${r[k]===''||r[k]===undefined?'':fmt(r[k])}" aria-label="${esc(mname(id))} ${k}"></td>`).join('')}
  <td><select class="i" data-cg="mode" data-mid="${id}" style="width:130px">${opts(['Espèces','Virement bancaire','Mobile money'],r.mode||'Espèces')}</select></td><td><input class="i" data-cg="ref" data-mid="${id}" style="width:120px" value="${esc(r.ref||'')}"></td></tr>`).join('')}
  </tbody><tfoot><tr><td></td><td>Total</td>${COT.map(([k])=>`<td class="n" id="cg-t-${k}">${fmt(s.t[k])}</td>`).join('')}<td colspan="2"></td></tr></tfoot></table></div>
  <p class="hint">Saisie directe : chaque montant s'enregistre automatiquement. Le même tableau figure dans le point financier du compte rendu. <span id="cg-state"></span></p>`})():`<div class="empty"><b>Aucune séance</b>Créez une séance pour saisir le tableau récapitulatif des cotisations.<div style="margin-top:12px"><button class="btn pri" data-act="newMeeting">${ico('plus')}Nouvelle séance</button></div></div>`}
 if(cotTab==='cumul'){const [f,t]=cuRange();const c=cumul(f,t);
  body=`<div class="row" style="margin-bottom:12px"><label class="f">Du<input class="i" type="date" id="cu-from" value="${f}"></label><label class="f">Au<input class="i" type="date" id="cu-to" value="${t}"></label><span class="hint" style="align-self:flex-end">${c.n} séance(s)</span><span style="flex:1"></span><button class="btn" data-act="csvCumul">Exporter vers Excel</button><button class="btn pri" data-act="pdfCumul">${ico('pdf')}Imprimer</button></div>
  ${c.rows.length?`<div class="tw"><table class="t"><thead><tr><th>Membre</th><th class="n">Séances</th>${CUM.map(([,l])=>`<th class="n">${l}</th>`).join('')}<th class="n">Épargne (dernière)</th></tr></thead><tbody>${c.rows.map(r=>`<tr><td><b>${esc(dname(r.m))}</b></td><td class="n">${r.n}</td>${CUM.map(([k])=>`<td class="n">${r[k]?fmt(r[k]):'<span class="muted">0</span>'}</td>`).join('')}<td class="n">${fmt(r.ep)}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td></td>${CUM.map(([k])=>`<td class="n">${fmt(c.tot[k])}</td>`).join('')}<td class="n">${fmt(c.tot.ep)}</td></tr></tfoot></table></div>`:`<div class="empty"><b>Aucune cotisation sur cette période</b>Élargissez les dates.</div>`}`}
 if(cotTab==='retards'){const a=arrears();const late=list('loans').filter(l=>loanState(l).k==='bad');const c=cfg();
  body=`<div class="grid g2"><div class="card"><h3>Retards de cotisation</h3>${a.length?`<div class="tw"><table class="t"><thead><tr><th>Membre</th><th class="n">Séances</th><th class="n">Manque</th><th class="n">Pénalités</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(dname(x.m))}</b></td><td class="n">${x.n}</td><td class="n">${fmt(x.manque)}</td><td class="n">${fmt(x.penalite)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>Aucun retard détecté</b>Le calcul compare la tontine versée au montant attendu par séance, saisi dans la fiche de chaque membre${num(c.penaliteCotisation)?'':' (pénalité par retard : à définir dans Paramètres)'}.</div>`}</div>
  <div class="card"><h3>Retards de remboursement</h3>${late.length?`<div class="tw"><table class="t"><thead><tr><th>Emprunteur</th><th>Échéance</th><th class="n">Reste dû</th></tr></thead><tbody>${late.map(l=>`<tr data-act="loan" data-id="${l.id}" style="cursor:pointer"><td><b>${esc(mname(l.membre))}</b></td><td>${fdate(l.echeance)}</td><td class="n">${fmt(loanCalc(l).reste)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>Aucun remboursement en retard</b>Les prêts dont l'échéance est dépassée apparaîtront ici.</div>`}</div></div>`}
 if(cotTab==='fiches'){const rows=[];ms.forEach(m=>(m.benef||[]).forEach((b,i)=>rows.push({d:m,b,i})));
  body=rows.length?`<div class="tw"><table class="t"><thead><tr><th>Séance</th><th>Bénéficiaire</th><th class="n">Parts</th><th class="n">Montant</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${fdate(r.d.date)}</td><td><b>${esc(mname(r.b.m))}</b></td><td class="n">${fmt(r.b.p)}</td><td class="n">${fmt(r.b.montant)}</td><td><button class="btn sm" data-act="ficheOf" data-id="${r.d.id}" data-i="${r.i}">${ico('pdf')}Fiche de cotisation</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>Aucun bénéficiaire enregistré</b>Ajoutez les bénéficiaires dans le point financier de la séance.</div>`}
 return ph('Finances','Cotisations',"Tableau récapitulatif par séance, cumul par membre, retards et fiches des bénéficiaires. Tout s'imprime avec l'en-tête de l'association.")+`<div class="tabs">${T.map(([k,l])=>`<button class="${cotTab===k?'on':''}" data-act="cotTab" data-t="${k}">${l}</button>`).join('')}</div>`+body;
};

/* ---------- tour ---------- */
VIEWS.tour=()=>{const t=S.tour;const pv=partValue();
 if(!t||!(t.rows||[]).length)return ph('Finances','Tour de cotisation','Ordre de passage des bénéficiaires pour le cycle.',`<button class="btn pri" data-act="editTour">${ico('plus')}Créer le tour</button>`)+`<div class="empty"><b>Aucun tour enregistré</b>Créez le classement du prochain tour à partir du tirage au sort.</div>`;
 const tot=t.rows.reduce((s,r)=>s+r.benef.reduce((a,b)=>a+num(b.p),0),0);const cur=ym(today());
 return ph('Finances',`Classement du tour ${esc(t.cycle||'')}`,`${t.rows.length} mois · ${fmt(tot)} parts${pv?' · valeur de la part '+F(pv):''}.`,`<button class="btn" data-act="editTour">${ico('edit')}Modifier</button><button class="btn pri" data-act="pdfTour">${ico('pdf')}Imprimer le classement</button>`)+
 `<div class="tw" style="margin-bottom:18px"><table class="t"><thead><tr><th>N°</th><th>Mois</th><th>Bénéficiaires</th><th class="n">Parts</th>${pv?'<th class="n">Montant</th>':''}</tr></thead><tbody>${t.rows.map((r,i)=>{const p=r.benef.reduce((a,b)=>a+num(b.p),0);return `<tr style="${r.mois===cur?'background:var(--accent-soft)':''}"><td class="mono">${String(i+1).padStart(2,'0')}</td><td><b>${fmonth(r.mois)}</b>${r.mois===cur?' <span class="chip acc">Ce mois</span>':''}${r.mois<cur?' <span class="chip">Passé</span>':''}</td><td>${r.benef.map(b=>`<span class="chip" style="margin:2px">${esc(mname(b.m))} · ${fmt(b.p)}</span>`).join('')}</td><td class="n">${fmt(p)}</td>${pv?`<td class="n">${fmt(p*pv)}</td>`:''}</tr>`}).join('')}</tbody><tfoot><tr><td colspan="3">Total général</td><td class="n">${fmt(tot)}</td>${pv?`<td class="n">${fmt(tot*pv)}</td>`:''}</tr></tfoot></table></div>
 ${(t.tirage||[]).length?`<div class="card"><h3>Résultat du tirage au sort</h3><div class="mlist">${t.tirage.map((x,i)=>`<div class="row" style="flex-wrap:nowrap"><span class="mono muted" style="width:26px">${i+1}</span>${avatar(M(x.m)||{nomUsuel:x.m})}<div><b>${esc(mname(x.m))}</b><div class="hint">${fmt(x.p)} part(s)</div></div></div>`).join('')}</div></div>`:''}`;
};

/* ---------- loans ---------- */
VIEWS.prets=()=>{const ls=list('loans').sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 const act=ls.filter(l=>loanState(l).k!=='good');const enc=act.reduce((s,l)=>s+loanCalc(l).reste,0);
 return ph('Finances','Prêts & garanties',"Chaque prêt a sa fiche : montant, intérêts, échéance, épargne de l'emprunteur et des avalistes, remboursements.",`<button class="btn pri" data-act="newLoan">${ico('plus')}Nouvelle fiche de prêt</button>`)+
 `<div class="kpis"><div class="kpi"><span>Prêts actifs</span><b>${act.length}</b></div><div class="kpi" style="--c:var(--navy)"><span>Encours</span><b>${fmt(enc)}</b><small>FCFA</small></div><div class="kpi" style="--c:var(--red)"><span>En retard</span><b>${ls.filter(l=>loanState(l).k==='bad').length}</b></div><div class="kpi" style="--c:var(--lime)"><span>Soldés</span><b>${ls.filter(l=>loanState(l).k==='good').length}</b></div></div>`+
 exposure(act)+
 (ls.length?`<div class="tw"><table class="t"><thead><tr><th>Date</th><th>Emprunteur</th><th class="n">Montant</th><th>Garanties</th><th class="n">Couverture</th><th class="n">Reste dû</th><th>Échéance</th><th>Statut</th></tr></thead><tbody>${ls.map(l=>{const c=loanCalc(l),st=loanState(l);return `<tr data-act="loan" data-id="${l.id}" style="cursor:pointer"><td>${fdate(l.date)}</td><td><b>${esc(mname(l.membre))}</b></td><td class="n">${fmt(l.montant)}</td><td class="small" style="min-width:220px">${esc(garText(l))}</td><td class="n"><span class="chip ${c.couv>=100?'good':'bad'}">${Math.round(c.couv)} %</span></td><td class="n">${fmt(c.reste)}</td><td>${l.echeance?fdate(l.echeance):'<span class="muted">—</span>'}</td><td><span class="chip ${st.k}">${st.t}</span></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><b>Aucun prêt</b>Créez une fiche de prêt pour chaque emprunt accordé en séance.</div>`);
};

function exposure(act){const e={};act.forEach(l=>{if(num(l.epargnePropre)){e[l.membre]=e[l.membre]||{eng:0,n:0};e[l.membre].eng+=num(l.epargnePropre);e[l.membre].n++}(l.avalistes||[]).forEach(a=>{if(!a.m)return;e[a.m]=e[a.m]||{eng:0,n:0};e[a.m].eng+=num(a.montant);e[a.m].n++})});
 const rows=Object.entries(e).map(([id,x])=>({id,...x,ep:lastEpargne(id)})).filter(x=>x.eng>0).sort((a,b)=>b.eng/(b.ep||1)-a.eng/(a.ep||1));
 if(!rows.length)return '';
 return `<div class="card" style="margin-bottom:16px"><h3>Engagements d'épargne <span class="hint" style="font-weight:400">Épargne engagée en garantie sur les prêts actifs, comparée à l'épargne de la dernière séance</span></h3><div class="mlist" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${rows.map(x=>{const p=x.ep?x.eng/x.ep*100:999;return `<div><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>${esc(mname(x.id))}</b><span class="chip ${p>100?'bad':p>85?'warn':'good'}">${p>=999?'épargne inconnue':Math.round(p)+' %'}</span></div><div class="bar" style="margin:6px 0 2px"><i style="width:${Math.min(100,p)}%;background:${p>100?'var(--bad)':p>85?'var(--warn)':'var(--accent)'}"></i></div><div class="hint">${fmt(x.eng)} engagés sur ${fmt(x.ep)} · ${x.n} prêt(s)</div></div>`}).join('')}</div></div>`}

let stTab='statuts',stQ='',stEdit=false,stHist=false;
function articles(txt){const lines=String(txt||'').split(/\r?\n/);const out=[];let cur=null;
 lines.forEach(l=>{if(!l.trim()){if(cur)cur.body.push('');return}
  const h=l.match(/^\s*(TITRE|Titre|CHAPITRE|Chapitre)\s+([\dIVXLC]+)\b/)||l.match(/^\s*(PRÉAMBULE|Préambule|PREAMBULE)\s*$/);
  const a=l.match(/^\s*(ARTICLE|Article|Art\.)\s*([\dIVXLC]+(?:er|e)?)\s*[:.\-–—]?\s*(.*)$/);
  const sh=l.match(/^\s*([A-Z]|\d{1,2})\.\s+\S/)&&l.trim().length<70;
  if(h){out.push({type:'h',title:l.trim()});cur=null}
  else if(a){cur={type:'a',num:a[2],title:a[3].trim(),body:[]};out.push(cur)}
  else if(sh){out.push({type:'s',title:l.trim()});cur=null}
  else if(cur)cur.body.push(l);
  else out.push({type:'p',text:l})});return out}
function lineHtml(l,hl){const t=l.trim();if(!t)return '';const m=t.match(/^(-|−|•|➢|·)\s*(.*)$/);
 if(m){const lvl=m[1]==='➢'||m[1]==='•'?'b1':m[1]==='·'?'b3':'b2';return `<div class="li ${lvl}">${hl(m[2])}</div>`}
 return `<div class="pl${/^\s{2,}/.test(l)?' ind':''}">${hl(t)}</div>`}

 "Les statuts comportent deux « Titre III » (Éligibilité, puis Structures et attributions) : la numérotation des titres suivants est à revoir.",

 else if(stHist){body=`<div class="row" style="margin-bottom:12px"><button class="btn sm" data-act="stHistToggle">${ico('back')}Retour au texte</button></div>`+(hist.length?`<div class="tw"><table class="t"><thead><tr><th>Remplacée le</th><th>Version</th><th>Modifiée par</th><th>Motif</th><th></th></tr></thead><tbody>${hist.map((h,i)=>`<tr><td>${fdate(String(h.date||'').slice(0,10))}</td><td>${esc(h.version||'—')}</td><td>${esc(h.par||'')}</td><td class="small">${esc(h.motif||'')}</td><td style="white-space:nowrap"><button class="btn sm" data-act="stHistPrint" data-i="${i}">${ico('pdf')}Voir</button><button class="btn sm" data-act="stRestore" data-i="${i}">Restaurer</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>Aucune version antérieure</b>Chaque modification enregistrée conserve ici la version remplacée.</div>`)}
 else{const arts=articles(txt);const q=stQ.toLowerCase();const hl=s=>{const e=esc(s);if(!q)return e;return e.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),x=>`<mark>${x}</mark>`)};

const TZS=[['Europe/Paris','France'],['Europe/Brussels','Belgique'],['Europe/Berlin','Allemagne'],['Europe/Zurich','Suisse'],['Europe/London','Royaume-Uni'],['Europe/Rome','Italie'],['Europe/Madrid','Espagne'],['America/Toronto','Canada (Est)'],['America/Vancouver','Canada (Ouest)'],['America/New_York','États-Unis (Est)'],['America/Chicago','États-Unis (Centre)'],['America/Los_Angeles','États-Unis (Ouest)'],['Africa/Douala','Cameroun'],['Africa/Libreville','Gabon'],['Africa/Abidjan','Côte d’Ivoire'],['Africa/Lagos','Nigeria / Bénin'],['Africa/Accra','Ghana'],['Africa/Dakar','Sénégal'],['Africa/Johannesburg','Afrique du Sud'],['Asia/Dubai','Émirats arabes unis'],['Asia/Shanghai','Chine']];
const diaspora=()=>members().filter(m=>m.diaspora);
function diasporaZones(){const seen={};diaspora().forEach(m=>{const tz=m.fuseau||'Europe/Paris';const lbl=m.pays||(TZS.find(t=>t[0]===tz)||[,tz])[1];if(!seen[tz])seen[tz]={tz,label:lbl,ms:[]};seen[tz].ms.push(m)});return Object.values(seen)}
function tzTime(date,hhmm,tz){if(!date||!hhmm)return '—';try{const [y,mo,d]=date.split('-').map(Number);const [h,mi]=hhmm.split(':').map(Number);const t=new Date(Date.UTC(y,mo-1,d,h,mi));
  const time=t.toLocaleTimeString('fr-FR',{timeZone:tz,hour:'2-digit',minute:'2-digit'}).replace(':','h');const day=t.toLocaleDateString('fr-CA',{timeZone:tz});return day!==date?time+' ('+t.toLocaleDateString('fr-FR',{timeZone:tz,weekday:'long',day:'numeric',month:'long'})+')':time}catch(e){return hhmm}}
const hh=t=>(t||'').replace(':','h');
const dayName=iso=>{try{return new Date(iso+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long'})}catch(e){return ''}};
function nextMeeting(){const up=meetings().filter(m=>m.date>=today()).sort((a,b)=>a.date.localeCompare(b.date));return up[0]||null}
function convocationText(d){const c=cfg();const el=d.enLigne||{};const zs=diasporaZones();
  return `*${c.nom} – « ${c.devise} »*\n\n*Convocation à l'Assemblée générale*\n📅 ${dayName(d.date)} ${fdate(d.date)}\n🕓 ${hh(d.heureDebut)||'—'} (heure de Lomé)\n📍 ${d.lieu||'Lieu à préciser'}${d.hote?` – chez ${mname(d.hote)}`:''}\n${d.president?`🎙️ Président(e) de séance : ${mname(d.president)}\n`:''}`+

function projCalc(p){const col=(p.contributions||[]).reduce((s,c)=>s+num(c.montant),0);const dep=(p.depenses||[]).reduce((s,c)=>s+num(c.montant),0);

  return {col,dep,solde:col-dep,budget:num(p.budget),couv:num(p.budget)?col/num(p.budget)*100:0,prog,done,n:et.length,next,late:et.filter(e=>!e.fait&&e.echeance&&e.echeance<today()).length}}

function biPresets(){const out=[];const t=S.tour;const ms=meetings();
  if(t?.debut&&t?.fin)out.push({k:'tour',label:`Tour ${t.cycle||''} : AG du ${fdate(t.debut)} au ${fdate(t.fin)}`,from:t.debut,to:t.fin});
  else if(t?.rows?.length){const f=t.rows[0].mois+'-01';const lm=t.rows[t.rows.length-1].mois;const [y,m]=lm.split('-').map(Number);const l=new Date(y,m,0);out.push({k:'tour',label:`Tour ${t.cycle||''} (${fmonth(t.rows[0].mois)} – ${fmonth(lm)})`,from:f,to:`${y}-${String(m).padStart(2,'0')}-${String(l.getDate()).padStart(2,'0')}`})}

function agCalendar(from,to){const out=[];let d=new Date(from+'T12:00:00');d.setDate(1);const end=new Date(to+'T12:00:00');
  while(d<=end){const s=secondSunday(d.getFullYear(),d.getMonth());const iso=s.getFullYear()+'-'+String(s.getMonth()+1).padStart(2,'0')+'-'+String(s.getDate()).padStart(2,'0');if(iso>=from&&iso<=to)out.push(iso);d.setMonth(d.getMonth()+1)}
  const ms=meetings().filter(m=>m.date>=from&&m.date<=to);ms.forEach(m=>{if(!out.some(x=>x.slice(0,7)===m.date.slice(0,7)))out.push(m.date)});
  return out.sort().map(iso=>{const m=ms.find(x=>x.date.slice(0,7)===iso.slice(0,7));const r=(S.tour?.rows||[]).find(x=>x.mois===(m?m.date:iso).slice(0,7));return {date:m?m.date:iso,m,benef:m?.benef?.length?m.benef.map(b=>b.m):(r?r.benef.map(b=>b.m):[])}})}
function bilanData(from,to){const ms=meetings().filter(d=>d.date>=from&&d.date<=to).sort((a,b)=>a.date.localeCompare(b.date));const st=S.bilans?.[biKey(from,to)]||{};

  const pres={};members(true).forEach(m=>pres[m.id]={P:0,L:0,R:0,A:0,E:0,n:0});ms.forEach(d=>Object.entries(d.pres||{}).forEach(([id,v])=>{if(pres[id]&&v in pres[id]){pres[id][v]++;pres[id].n++}}));

function memberSituation(mid){
  const ms=meetings();const rows=ms.filter(d=>d.cot?.[mid]&&COT.some(([k])=>num(d.cot[mid][k]))).map(d=>({d,c:d.cot[mid]}));
  const lastEp=rows.find(r=>r.c.epargne!==''&&r.c.epargne!==undefined);
  const loans=list('loans').filter(l=>l.membre===mid).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const garant=list('loans').filter(l=>(l.avalistes||[]).some(a=>a.m===mid)&&loanState(l).k!=='good');
  const aids=list('aids').filter(a=>a.membre===mid);
  const tour=(S.tour?.rows||[]).filter(r=>r.benef.some(b=>b.m===mid)).map(r=>({mois:r.mois,p:r.benef.filter(b=>b.m===mid).reduce((s,b)=>s+num(b.p),0)}));
  let P=0,n=0;ms.forEach(d=>{const v=d.pres?.[mid];if(v){n++;if(isPresent(v))P++}});
  const benefRecu=[];ms.forEach(d=>(d.benef||[]).forEach(b=>{if(b.m===mid)benefRecu.push({date:d.date,montant:num(b.montant),p:b.p})}));
  return {rows,ep:lastEp?num(lastEp.c.epargne):0,epDate:lastEp?.d.date,loans,garant,aids,tour,rate:n?Math.round(P/n*100):null,n,benefRecu}}

const SANC_TYPES=[
 ['retard30','Retard de plus de 30 minutes',()=>num(cfg().amendeRetard)||500,'Règlement intérieur, titre IV'],
 ['retardPF','Retard après le point financier',()=>2000,'Règlement intérieur, titre IV'],
 ['absence','Absence non prévenue (48 h avant)',()=>num(cfg().amendeAbsence)||2000,'Règlement intérieur, titre III-2'],
 ['tontine','Défaut de tontine (pas encore bénéficié)',()=>num(cfg().penaliteCotisation)||5000,'Règlement intérieur, titre III-1'],
 ['tontineB','Défaut de tontine (déjà bénéficié)',()=>10000,'Règlement intérieur, titre III-1'],
 ['moralite','Manquement à la moralité',()=>0,'Règlement intérieur, titre III-3'],
 ['autre','Autre sanction',()=>0,'Décision de l’assemblée générale']];
const sancType=k=>SANC_TYPES.find(t=>t[0]===k)||SANC_TYPES[SANC_TYPES.length-1];
const minutes=t=>{if(!t)return null;const [h,m]=String(t).split(':').map(Number);return h*60+(m||0)};
function hadBenefited(mid,date){return meetings().some(d=>d.date<date&&(d.benef||[]).some(b=>b.m===mid))}
/* sanctions calculées automatiquement à partir des comptes rendus */
function autoSanctions(){const out=[];
  meetings().forEach(d=>{if(d.date>today())return;
    Object.entries(d.pres||{}).forEach(([mid,v])=>{
      if(v==='R'){const late=minutes(d.arr?.[mid])!=null&&minutes(d.heureDebut)!=null?minutes(d.arr[mid])-minutes(d.heureDebut):null;
        if(late===null||late>30)out.push({id:`auto:${d.id}:${mid}:retard30`,auto:true,date:d.date,meetingId:d.id,membre:mid,type:'retard30',montant:sancType('retard30')[2](),motif:late===null?'Retard (heure d’arrivée non notée)':`Retard de ${late} minutes`})}
      if(v==='A')out.push({id:`auto:${d.id}:${mid}:absence`,auto:true,date:d.date,meetingId:d.id,membre:mid,type:'absence',montant:sancType('absence')[2](),motif:'Absent sans avoir prévenu'})});
    if(d.cot&&Object.keys(d.cot).length)members().forEach(m=>{const att=num(m.cotisationMensuelle);if(!att)return;const p=num(d.cot[m.id]?.tontine);if(d.pres?.[m.id]==='E'&&!p)return;
      if(p<att){const b=hadBenefited(m.id,d.date);const k=b?'tontineB':'tontine';out.push({id:`auto:${d.id}:${m.id}:${k}`,auto:true,date:d.date,meetingId:d.id,membre:m.id,type:k,montant:sancType(k)[2](),motif:`Tontine versée ${fmt(p)} sur ${fmt(att)} FCFA attendus`})}})});
  return out}
function allSanctions(){const st=S.sanctions||{};const auto=autoSanctions().map(a=>({...a,...(st[a.id]||{}),id:a.id,auto:true}));
  const man=Object.values(st).filter(x=>!String(x.id).startsWith('auto:'));return [...auto,...man].sort((a,b)=>String(b.date).localeCompare(String(a.date)))}
let sanSeason='',sanMember='',sanState='Toutes';
function seasons(){const P=(typeof biPresets==='function'?biPresets():[]).filter(p=>p.k!=='all');return [...P,{k:'all',label:'Toutes les saisons',from:'2000-01-01',to:'2999-12-31'}]}

 let L=allSanctions().filter(x=>x.date>=se.from&&x.date<=se.to);if(sanMember)L=L.filter(x=>x.membre===sanMember);
 const act=L.filter(x=>!x.annule);const tot=act.reduce((s,x)=>s+num(x.montant),0),paid=act.filter(x=>x.paye).reduce((s,x)=>s+num(x.montant),0);
 const shown=sanState==='Impayées'?act.filter(x=>!x.paye):sanState==='Payées'?act.filter(x=>x.paye):sanState==='Annulées'?L.filter(x=>x.annule):L;
 const months={};shown.forEach(x=>{const k=ym(x.date);(months[k]=months[k]||[]).push(x)});
 const byM={};act.forEach(x=>{byM[x.membre]=byM[x.membre]||{n:0,t:0,d:0};byM[x.membre].n++;byM[x.membre].t+=num(x.montant);if(!x.paye)byM[x.membre].d+=num(x.montant)});

 `<div class="card" style="margin-bottom:14px"><div class="row" style="align-items:flex-end"><label class="f" style="min-width:240px">Saison<select class="i" data-act-change="sanSeason">${SE.map(s=>`<option value="${s.k}" ${s.k===sanSeason?'selected':''}>${esc(s.label)}</option>`).join('')}</select></label>

 <div class="kpis"><div class="kpi" style="--c:var(--red)"><span>Sanctions</span><b>${act.length}</b><small>sur la saison</small></div><div class="kpi" style="--c:var(--navy)"><span>Montant total</span><b>${fmt(tot)}</b><small>FCFA</small></div><div class="kpi" style="--c:var(--lime)"><span>Encaissé</span><b>${fmt(paid)}</b><small>FCFA</small></div><div class="kpi" style="--c:var(--orange)"><span>Reste à payer</span><b>${fmt(tot-paid)}</b><small>FCFA</small></div></div>
 <div class="grid" style="grid-template-columns:minmax(0,1fr) 320px;align-items:start" id="san-layout"><div class="stack">${Object.keys(months).length?Object.keys(months).sort().reverse().map(k=>{const r=months[k];const mt=r.filter(x=>!x.annule).reduce((s,x)=>s+num(x.montant),0);
   return `<div class="card"><h3>${fmonth(k)} <span class="chip">${r.length} sanction(s) · ${F(mt)}</span></h3><div class="tw"><table class="t"><thead><tr><th>Date</th><th>Membre</th><th>Motif</th><th class="n">Montant</th><th>État</th>${ed?'<th></th>':''}</tr></thead><tbody>${r.map(x=>`<tr style="${x.annule?'opacity:.55':''}"><td style="white-space:nowrap">${fdate(x.date)}</td><td><div class="row" style="flex-wrap:nowrap">${avatar(M(x.membre)||{nomUsuel:x.membre},26)}<b>${esc(mname(x.membre))}</b></div></td><td><b>${esc(sancType(x.type)[1])}</b><div class="hint">${esc(x.motif||'')}${x.auto?' · calculé automatiquement':''}</div></td><td class="n">${fmt(x.montant)}</td>
   <td>${x.annule?`<span class="chip">Annulée</span><div class="hint">${esc(x.motifAnnulation||'')}</div>`:x.paye?`<span class="chip good">Payée</span><div class="hint">${x.payeLe?fdate(x.payeLe):''}</div>`:'<span class="chip bad">Impayée</span>'}</td>
   ${ed?`<td style="white-space:nowrap">${!x.annule&&!x.paye?`<button class="btn sm" data-act="sanPay" data-id="${esc(x.id)}">Payée</button>`:''}${!x.annule?`<button class="btn ghost sm danger" data-act="sanCancel" data-id="${esc(x.id)}">Annuler</button>`:`<button class="btn ghost sm" data-act="sanRestore" data-id="${esc(x.id)}">Rétablir</button>`}</td>`:''}</tr>`).join('')}</tbody></table></div></div>`}).join(''):`<div class="empty"><b>Aucune sanction</b>Aucune sanction sur cette période${sanState!=='Toutes'?' pour ce filtre':''}.</div>`}</div>
  <div class="stack" style="position:sticky;top:12px"><div class="card"><h3>Par membre</h3>${Object.keys(byM).length?Object.entries(byM).sort((a,b)=>b[1].t-a[1].t).map(([id,v])=>`<div class="check" style="align-items:center">${avatar(M(id)||{nomUsuel:id},28)}<span style="flex:1"><b>${esc(mname(id))}</b><br><span class="hint">${v.n} sanction(s) · ${fmt(v.t)} FCFA</span></span>${v.d?`<span class="chip bad">${fmt(v.d)}</span>`:'<span class="chip good">À jour</span>'}</div>`).join(''):'<div class="hint">Aucune.</div>'}</div>

const AudioDB={db:null,open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{const r=indexedDB.open('thetwelve-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('seg');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},

function recMime(){for(const t of ['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/webm','audio/mp4'])if(window.MediaRecorder&&MediaRecorder.isTypeSupported?.(t))return t;return ''}
async function recStart(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast("L'enregistrement audio n'est pas disponible sur cet appareil.");return}

function recNewSegment(){const mime=recMime();const mr=new MediaRecorder(REC.stream,mime?{mimeType:mime,audioBitsPerSecond:32000}:{audioBitsPerSecond:32000});REC.mr=mr;REC.chunks=[];REC.segStart=Date.now();

async function transcribeSeg(blob){const key=oaKey();if(!key)throw {code:'nokey'};const ext=(blob.type.includes('ogg')?'ogg':blob.type.includes('mp4')?'m4a':'webm');
  const fd=new FormData();fd.append('file',blob,'segment.'+ext);fd.append('model','whisper-1');fd.append('language','fr');fd.append('response_format','text');
  let r;try{r=await fetch('https://api.openai.com/v1/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+key},body:fd})}catch(e){throw {code:'offline'}}
  if(!r.ok)throw {code:r.status===401?'badkey':r.status===429?'rate':'http'};return (await r.text()).trim()}
async function recTranscribe(btn){const segs=D.rec?.segments||[];if(!segs.length){toast('Aucun enregistrement à transcrire.');return}if(!oaKey()){toast('Ajoutez la clé de transcription dans Paramètres › Assistant de rédaction.');return}

/* ---------- réunion en direct : interaction de tous via Internet ----------
   Relais : serveur ntfy (ntfy.sh par défaut). Chaque message est chiffré (AES-GCM) avec une clé
   dérivée du secret de l'association : le relais ne voit que du texte illisible. */
const LIVE={es:null,meetingId:'',topic:'',key:null,msgs:[],seen:new Set(),status:'off',err:'',lastMine:0,poller:null};
const liveServer=()=>String(cfg().liveServer||'https://ntfy.sh').replace(/\/+$/,'');
function ensureLiveSecret(){return String(cfg().liveSecret||'').trim()||'THE-TWELVE|direct|2026'}
async function liveDerive(mid){const sec=ensureLiveSecret();if(!sec)throw new Error('nosecret');const enc=new TextEncoder();
  const h=await crypto.subtle.digest('SHA-256',enc.encode('topic|'+sec+'|'+mid));const topic='tw'+[...new Uint8Array(h)].slice(0,14).map(x=>x.toString(16).padStart(2,'0')).join('');
  const base=await crypto.subtle.importKey('raw',enc.encode(sec),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('THE TWELVE|'+mid),iterations:60000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);return {topic,key}}
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function liveEncrypt(obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},LIVE.key,new TextEncoder().encode(JSON.stringify(obj)));return 'tw1.'+b64(iv)+'.'+b64(ct)}
async function liveDecrypt(s){if(!String(s).startsWith('tw1.'))return null;const [,iv,ct]=s.split('.');try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)},LIVE.key,unb64(ct));return JSON.parse(new TextDecoder().decode(pt))}catch(e){return null}}
function liveMe(){return {mid:isMember()?session.mid:(cfg()[session.role]||''),nom:session.nom,role:session.role}}
async function liveSend(obj){if(!LIVE.key){toast('Rejoignez d’abord la réunion en direct.');return false}
  const msg={...obj,...liveMe(),ts:Date.now(),uid:uid('m')};const body=await liveEncrypt(msg);
  if(body.length>3900){toast('Message trop long pour le direct.');return false}
  try{const r=await fetch(liveServer()+'/'+LIVE.topic,{method:'POST',body});if(!r.ok)throw 0;liveIngest(msg);return true}catch(e){toast("Pas de connexion au direct : vérifiez Internet.");return false}}
function liveIngest(m){if(!m||LIVE.seen.has(m.uid))return;LIVE.seen.add(m.uid);LIVE.msgs.push(m);LIVE.msgs.sort((a,b)=>a.ts-b.ts);if(route==='direct')scheduleLiveRender();

  const url=liveServer()+'/'+LIVE.topic+'/sse?since=all';
  try{const es=new EventSource(url);LIVE.es=es;es.onopen=()=>{LIVE.status='on';LIVE.err='';if(route==='direct')scheduleLiveRender()};
    es.onmessage=async ev=>{let d;try{d=JSON.parse(ev.data)}catch(e){return}if(d.event!=='message'||!d.message)return;const m=await liveDecrypt(d.message);if(m)liveIngest(m)};

let cassPreset='';
function cassRange(){const P=(typeof biPresets==='function'?biPresets():[]).filter(p=>p.k!=='all');if(!cassPreset)cassPreset=(P.find(p=>p.k==='tour')||P[0]||{}).k||'';return P.find(p=>p.k===cassPreset)||P[0]||null}
const cassKey=p=>('c-'+p.from+'_'+p.to).replace(/[^\w-]/g,'');
function cassData(){const p=cassRange();if(!p)return null;const B=bilanData(p.from,p.to);const st=(S.cassations||{})[cassKey(p)]||{};const R=st.rows||{};
  const sanc=allSanctions().filter(x=>!x.annule&&!x.paye&&x.date>=p.from&&x.date<=p.to);
  const rows=B.rows.map(r=>{const o=R[r.id]||{};const san=sanc.filter(x=>x.membre===r.id).reduce((s,x)=>s+num(x.montant),0);
    const pret=list('loans').filter(l=>l.membre===r.id&&loanState(l).k!=='good').reduce((s,l)=>s+loanCalc(l).reste,0);
    const autoRet=(st.retSanctions!==false?san:0)+(st.retPrets!==false?pret:0);const ret=o.retenue!==undefined&&o.retenue!==''?num(o.retenue):autoRet;
    return {id:r.id,e:r.e,it:r.it,tot:r.tot,san,pret,ret,net:Math.max(0,r.tot-ret),remis:!!o.remis,remisLe:o.remisLe||'',mode:o.mode||'',note:o.note||'',manual:o.retenue!==undefined&&o.retenue!==''}});
  const sum=k=>rows.reduce((s,r)=>s+num(r[k]),0);
  return {p,B,st,rows,key:cassKey(p),total:sum('net'),brut:sum('tot'),ret:sum('ret'),ep:sum('e'),it:sum('it'),remis:rows.filter(r=>r.remis).length,publie:!!st.publie,publieLe:st.publieLe||''}}
function cassStore(patch){const c=cassData();if(!c)return;const cur=(S.cassations||{})[c.key]||{id:c.key,from:c.p.from,to:c.p.to,rows:{}};put('cassations',c.key,{...cur,...patch,id:c.key})}
function cassRowStore(mid,patch){const c=cassData();const cur=(S.cassations||{})[c.key]||{id:c.key,from:c.p.from,to:c.p.to,rows:{}};const rows={...(cur.rows||{})};rows[mid]={...(rows[mid]||{}),...patch};put('cassations',c.key,{...cur,rows,id:c.key})}

/* ---------- Souvenirs : bibliothèque des photos et vidéos des AG et événements ----------
   Les fichiers sont chiffrés (AES-GCM) avec une clé tirée du code de l'association, puis publiés dans le dépôt GitHub du site.
   Tout membre qui a le code peut les regarder dans l'application ; seul le Secrétaire général peut les télécharger. */
const SV_VERIFIER='9e2eab611787bea996a08cac8280011d361d726b35fbb6ecfdf85802645526c6';
const SV_TYPES=['Assemblée générale','Événement','Fête de cassation','Visite','Solidarité','Autre'];
const SV_LS='tw-sv-key',GH_LS='tw-gh-token';
let svKeyCache=null,svRemote=null,svRemoteState='',svOpen=null,svUrls=[];
const svGh=()=>{const r=String(cfg().ghRepo||'agricyril22-cpu/thetwelve').split('/');return {owner:r[0],repo:r[1]||'thetwelve',branch:cfg().ghBranch||'main'}};
const svSite=()=>String(cfg().siteUrl||'https://agricyril22-cpu.github.io/thetwelve').replace(/\/+$/,'');
const ghToken=()=>{try{return localStorage.getItem(GH_LS)||''}catch(e){return ''}};
const svCanEdit=()=>can('cr');const svIsSG=()=>session?.role==='secretaire';
const b64e=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function svDerive(code){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(code).trim().toUpperCase()),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode('THE TWELVE|souvenirs|v1'),iterations:150000,hash:'SHA-256'},k,256))}
async function svSetCode(code){const raw=await svDerive(code);const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',raw))].map(x=>x.toString(16).padStart(2,'0')).join('');
  if(h!==SV_VERIFIER)return false;try{localStorage.setItem(SV_LS,b64e(raw))}catch(e){}svKeyCache=null;return true}
async function svKey(){if(svKeyCache)return svKeyCache;let raw='';try{raw=localStorage.getItem(SV_LS)||''}catch(e){}if(!raw)return null;
  svKeyCache=await crypto.subtle.importKey('raw',b64d(raw),'AES-GCM',false,['encrypt','decrypt']);return svKeyCache}
async function svEnc(bytes){const k=await svKey();const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,bytes));const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return o}
async function svDec(bytes){const k=await svKey();const u=new Uint8Array(bytes);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},k,u.slice(12)))}
/* cache local (IndexedDB) des fichiers chiffrés */
const SvDB={db:null,open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open('thetwelve-souvenirs',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async get(k){const db=await this.open();return new Promise(res=>{const t=db.transaction('f').objectStore('f').get(k);t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null)})},
  async put(k,v){const db=await this.open();return new Promise(res=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)})},
  async del(k){const db=await this.open();return new Promise(res=>{const t=db.transaction('f','readwrite');t.objectStore('f').delete(k);t.oncomplete=()=>res(true)})}};
async function svFetchEnc(path,fresh){if(!fresh){const c=await SvDB.get(path);if(c)return c}
  const g=svGh();const urls=[svSite()+'/'+path+(fresh?'?t='+Date.now():''),`https://raw.githubusercontent.com/${g.owner}/${g.repo}/${g.branch}/${path}`+(fresh?'?t='+Date.now():'')];
  for(const u of urls){try{const r=await fetch(u,{cache:fresh?'no-store':'default'});if(r.ok){const b=new Uint8Array(await r.arrayBuffer());if(!fresh)SvDB.put(path,b);return b}}catch(e){}}
  return null}
/* publication sur GitHub (Secrétaire général, jeton enregistré sur son appareil seulement) */
async function ghPut(path,bytes,message){const t=ghToken();if(!t)throw new Error('notoken');const g=svGh();const api=`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${path}`;
  const H={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};let sha;
  const cur=await fetch(api+'?ref='+g.branch,{headers:H,cache:'no-store'});if(cur.ok)sha=(await cur.json()).sha;else if(cur.status===401||cur.status===403)throw new Error('auth');
  const r=await fetch(api,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({message,branch:g.branch,content:b64e(bytes),...(sha?{sha}:{})})});
  if(!r.ok){if(r.status===401||r.status===403)throw new Error('auth');if(r.status===413||r.status===422)throw new Error('size');throw new Error('http'+r.status)}return true}
async function ghDel(path){const t=ghToken();if(!t)return;const g=svGh();const api=`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${path}`;const H={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'};
  const cur=await fetch(api+'?ref='+g.branch,{headers:H,cache:'no-store'});if(!cur.ok)return;const sha=(await cur.json()).sha;await fetch(api,{method:'DELETE',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({message:'Souvenirs : suppression',branch:g.branch,sha})})}
/* albums : liste locale (sauvegardes) + index publié (version en ligne) */
function svAlbums(){const loc=Object.values(S.souvenirs||{});const m={};[...(svRemote||[]),...loc].forEach(a=>{if(!a||!a.id)return;if(!m[a.id]||String(a.maj||'')>String(m[a.id].maj||''))m[a.id]=a});
  return Object.values(m).filter(a=>!a.supprime).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))}
async function svLoadRemote(){if(!(await svKey())){svRemoteState='nokey';if(route==='souvenirs')scheduleRender();return}svRemoteState='loading';
  const b=await svFetchEnc('souvenirs/index.bin',true);if(!b){svRemoteState=svRemote?'ok':'none';if(route==='souvenirs')scheduleRender();return}
  try{const j=JSON.parse(new TextDecoder().decode(await svDec(b)));svRemote=j.albums||[];svRemoteState='ok'}catch(e){svRemoteState='badkey'}
  if(route==='souvenirs')scheduleRender()}
async function svPublishIndex(){const all=Object.values(S.souvenirs||{});const bytes=await svEnc(new TextEncoder().encode(JSON.stringify({maj:new Date().toISOString(),albums:all})));
  await ghPut('souvenirs/index.bin',bytes,'Souvenirs : mise à jour de la bibliothèque');svRemote=all}
function svSave(a){a={...a,maj:new Date().toISOString()};put('souvenirs',a.id,a);return a}
/* images : réduction et vignette */
function svLoadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{res(i);setTimeout(()=>URL.revokeObjectURL(u),1000)};i.onerror=rej;i.src=u})}
function svCanvas(src,w0,h0,max,q,type='image/jpeg'){const r=Math.min(1,max/Math.max(w0,h0));const c=document.createElement('canvas');c.width=Math.round(w0*r);c.height=Math.round(h0*r);c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return {c,blob:()=>new Promise(res=>c.toBlob(res,type,q)),url:()=>c.toDataURL('image/jpeg',0.68)}}
function svVideoThumb(file){return new Promise(res=>{const v=document.createElement('video');const u=URL.createObjectURL(file);v.muted=true;v.preload='metadata';v.src=u;v.playsInline=true;
  const done=t=>{URL.revokeObjectURL(u);res(t)};v.onloadeddata=()=>{try{v.currentTime=Math.min(1,(v.duration||2)/3)}catch(e){done({thumb:'',dur:v.duration||0})}};
  v.onseeked=()=>{try{const k=svCanvas(v,v.videoWidth,v.videoHeight,480,0.7);done({thumb:k.url(),dur:v.duration||0,w:v.videoWidth,h:v.videoHeight})}catch(e){done({thumb:'',dur:v.duration||0})}};v.onerror=()=>done({thumb:'',dur:0});setTimeout(()=>done({thumb:'',dur:0}),8000)})}
async function svAddFiles(albumId,files){if(!(await svKey())){toast("Saisissez d'abord le code de l'association.");return}
  let a=clone(svAlbums().find(x=>x.id===albumId));if(!a)return;a.items=a.items||[];const st=$('#sv-progress');let n=0,pub=0,fail='';
  for(const f of files){n++;if(st)st.textContent=`Ajout ${n}/${files.length} : ${f.name}…`;
    const isV=f.type.startsWith('video/');const isI=f.type.startsWith('image/');if(!isV&&!isI){toast(f.name+' : format non pris en charge');continue}
    if(isV&&f.size>90e6){toast(f.name+' : vidéo trop lourde (90 Mo au plus). Raccourcissez-la ou compressez-la.');continue}
    const id=uid('sv');let bytes,meta={};
    if(isI){const im=await svLoadImg(f);const big=svCanvas(im,im.naturalWidth,im.naturalHeight,2400,0.86);bytes=new Uint8Array(await (await big.blob()).arrayBuffer());meta={thumb:svCanvas(im,im.naturalWidth,im.naturalHeight,480,0.7).url(),w:big.c.width,h:big.c.height,mime:'image/jpeg'}}
    else{bytes=new Uint8Array(await f.arrayBuffer());meta={...(await svVideoThumb(f)),mime:f.type||'video/mp4'}}
    const path=`souvenirs/${albumId}/${id}.bin`;const enc=await svEnc(bytes);await SvDB.put(path,enc);
    const item={id,path,kind:isV?'video':'photo',nom:f.name.replace(/\.[^.]+$/,''),legende:'',taille:bytes.length,ajoute:new Date().toISOString(),...meta,publie:false};
    if(ghToken()){try{await ghPut(path,enc,`Souvenirs : ${a.titre} · ${item.nom}`);item.publie=true;pub++}catch(e){fail=e.message}}
    a.items.push(item);a=svSave(a)}
  if(ghToken()&&pub){try{await svPublishIndex()}catch(e){fail=e.message}}
  if(st)st.textContent='';svMsg(fail,pub,n);render()}
function svMsg(fail,pub,n){if(fail==='auth')toast('Publication refusée : vérifiez le jeton GitHub dans Paramètres.');else if(fail==='size')toast('Fichier trop lourd pour la publication en ligne.');else if(fail)toast('Publication en ligne interrompue : vérifiez Internet, puis « Publier ce qui est en attente ».');
  else if(!ghToken())toast(`${n} fichier(s) ajouté(s) sur cet appareil. Pour les publier aux membres, enregistrez le jeton GitHub dans Paramètres.`);else toast(`${pub} fichier(s) publié(s) dans la bibliothèque`)}
async function svPublishPending(){if(!ghToken()){toast('Enregistrez d’abord le jeton GitHub dans Paramètres.');return}let pub=0,fail='';
  for(const a0 of svAlbums()){let a=clone(a0);let ch=false;for(const it of a.items||[]){if(it.publie)continue;const enc=await SvDB.get(it.path);if(!enc)continue;try{await ghPut(it.path,enc,'Souvenirs : '+a.titre);it.publie=true;ch=true;pub++}catch(e){fail=e.message;break}}if(ch)svSave(a);if(fail)break}
  try{await svPublishIndex()}catch(e){fail=fail||e.message}svMsg(fail,pub,pub);render()}

async function svDownload(albumId,idx){if(!svIsSG()){toast('Seul le Secrétaire général peut télécharger les souvenirs.');return}const a=svAlbums().find(x=>x.id===albumId);const it=a?.items?.[idx];if(!it)return;

function paper(inner,landscape){const c=cfg();return `<div class="paper" style="${landscape?'width:1122px':''}"><div class="lh"><img src="${LOGO}" alt=""><div class="t"><b>${esc(c.nom)}</b><i>“${esc(c.devise)}”</i><small>Contacts : ${esc(c.contacts)}</small></div></div><div class="doc" style="${landscape?'width:auto':''}">${inner}</div><div class="pf"><span style="float:left;font-weight:400;color:#666">© ${new Date().getFullYear()} THE TWELVE · Tous droits réservés</span>“${esc(c.devise)}”</div></div>`}

function crDoc(d,opt={}){
  const c=cfg();const pres=k=>Object.entries(d.pres||{}).filter(([,v])=>v===k).map(([id])=>id);
  const P=pres('P'),R=pres('R'),A=pres('A'),E=pres('E'),Lg=pres('L');
  const s=finSummary(d);let n=0;const H=t=>`<h2>${++n}. ${t}</h2>`;
  const present=members(true).filter(m=>isPresent(d.pres?.[m.id]));
  const loans=list('loans').filter(l=>l.date===d.date);const aids=list('aids').filter(a=>a.meetingId===d.id||a.date===d.date);
  const prev=meetings().find(m=>m.date<d.date);const trs=list('transfers').filter(t=>t.date<=d.date&&(!prev||t.date>prev.date));
  const cs=cassCalc(d.cassation||{});
  let h=`<h1>Compte rendu de l'Assemblée générale du ${fdate(d.date)}</h1>${num(d.version)>1?`<p style="text-align:center;font-weight:600;color:#b8640a;margin-top:-6px">Version n° ${d.version} corrigée${d.dateCorrection?' le '+fdate(d.dateCorrection):''}, intégrant les rectificatifs demandés par les membres</p>`:''}
  <div class="kv"><b>Lieu :</b><span>${esc(d.lieu||'—')}${d.hote?' (hôte : '+esc(mname(d.hote))+')':''}</span>
  <b>Réception :</b><span>${esc(d.reception||'—')}</span>
  <b>Président(e) de séance :</b><span>${esc(mname(d.president))}</span>${d.enLigne?.actif&&d.enLigne?.lien?`<b>Réunion en ligne :</b><span>${esc(d.enLigne.plateforme||'')} (diaspora)</span>`:''}
  <b>Secrétaire de séance :</b><span>${esc(mname(d.secretaireSeance))}</span>
  <b>Heure de début :</b><span>${esc((d.heureDebut||'—').replace(':','h'))}</span></div>
  <div class="box"><b>Présents (${P.length+R.length+Lg.length}) :</b> ${esc(nameList(P))}<br>${Lg.length?`<b>En ligne – diaspora (${Lg.length}) :</b> ${esc(nameList(Lg))}<br>`:''}<b>Retards (${R.length}) :</b> ${R.length?R.map(id=>esc(mname(id))+(d.arr?.[id]?' ('+d.arr[id].replace(':','h')+')':'')).join(', '):'Néant'}<br><b>Absents (${A.length}) :</b> ${A.length?esc(nameList(A)):'Néant'}${E.length?`<br><b>Excusés (${E.length}) :</b> ${esc(nameList(E))}`:''}</div>
  <h2>Ordre du jour</h2><ol style="margin:4px 0 0 18px;padding:0">${(d.odj||[]).map(o=>`<li>${esc(o)}</li>`).join('')}</ol>`;
  h+=H('Nouvelles de famille')+(present.map(m=>`<p><b>${esc(dname(m))} :</b> ${esc(d.nouv?.[m.id]?.trim()||'Rien de particulier à signaler.').replace(/\n/g,'<br>')}</p>`).join('')||'<p>—</p>');
  h+=H('Rapport de la dernière AG')+(para(d.rapport)||'<p>Lecture et adoption du compte rendu précédent.</p>');
  h+=H('Point financier')+`<table><tbody>
   <tr><td style="width:45%"><b>Tontine</b></td><td class="n">${F(s.t.tontine)}</td></tr>
   ${(d.benef||[]).length?`<tr><td><b>Bénéficiaire(s)</b></td><td>${d.benef.map(b=>`${esc(mname(b.m))} (${F(b.montant)})`).join(' ; ')}</td></tr>`:''}
   <tr><td><b>Collation</b></td><td class="n">${F(s.t.collation)}</td></tr><tr><td><b>Solidarité</b></td><td class="n">${F(s.t.solidarite)}</td></tr>
   ${s.t.remboursement?`<tr><td><b>Remboursements</b></td><td class="n">${F(s.t.remboursement)}</td></tr>`:''}${s.t.interet?`<tr><td><b>Intérêts</b></td><td class="n">${F(s.t.interet)}</td></tr>`:''}${s.t.scolaire?`<tr><td><b>Caisse scolaire</b></td><td class="n">${F(s.t.scolaire)}</td></tr>`:''}
  </tbody></table>`;
  if(loans.length)h+=`<h3>Emprunts</h3><table><thead><tr><th>Noms</th><th class="n">Montant emprunté</th><th>Garanties / Avalistes</th></tr></thead><tbody>${loans.map(l=>`<tr><td>${esc(mname(l.membre))}</td><td class="n">${F(l.montant)}</td><td>${esc(garText(l))}</td></tr>`).join('')}</tbody></table>`;
  h+=`<table><tbody><tr><td style="width:45%"><b>Épargne totale</b></td><td class="n">${F(s.t.epargne)}</td></tr><tr><td><b>Montant sur la table</b></td><td class="n">${F(s.table)}</td></tr><tr><td><b>Emprunts du jour</b></td><td class="n">${F(s.emprunts)}</td></tr><tr><td><b>Reste en caisse</b></td><td class="n"><b>${F(s.reste)}</b></td></tr></tbody></table>`;
  if(trs.length)h+=`<h3>Virements reçus sur le compte de l'association</h3><table><thead><tr><th>Date</th><th>Membre</th><th>Objet</th><th>Référence</th><th class="n">Montant</th></tr></thead><tbody>${trs.map(t=>`<tr><td>${fdate(t.date)}</td><td>${esc(mname(t.membre))}</td><td>${esc(t.objet)}</td><td>${esc(t.reference||'')}</td><td class="n">${fmt(t.montant)}</td></tr>`).join('')}</tbody></table>`;
  h+=para(d.notesFin);
  if(aids.length)h+=`<h3>Aides et accompagnements</h3><p>Dans le cadre de la solidarité qui caractérise notre association, les aides suivantes ont été accordées :</p><table><thead><tr><th>Nature de l'aide</th><th>Bénéficiaire</th><th class="n">Montant</th></tr></thead><tbody>${aids.map(a=>`<tr><td>${esc(a.nature)}</td><td>${esc(mname(a.membre))}</td><td class="n">${F(a.montant)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">TOTAL</td><td class="n">${F(aids.reduce((x,a)=>x+num(a.montant),0))}</td></tr></tfoot></table>`;
  h+=H('Point du jour')+(para(d.jour)||'');
  const pts=(d.points||[]).filter(p=>p.titre);if(pts.length){const nr=pts.filter(p=>p.statut!=='Résolu');h+=`<table><thead><tr><th>Point</th><th style="width:90px">Statut</th><th>Décision / suite à donner</th></tr></thead><tbody>${pts.map(p=>`<tr><td>${esc(p.titre)}${p.reporte&&p.origine?`<br><i style="font-size:11px">reporté de l'AG du ${fdate(p.origine)}</i>`:''}</td><td><b style="color:${p.statut==='Résolu'?'#1d8a4f':'#b8640a'}">${esc(p.statut||'Non résolu')}</b></td><td>${esc(p.suite||'')}</td></tr>`).join('')}</tbody></table>${nr.length?`<p><b>Points reportés à l'ordre du jour de la prochaine AG :</b> ${nr.map(p=>esc(p.titre)).join(' ; ')}.</p>`:''}`}
  else if(!String(d.jour||'').trim())h+='<p>—</p>';
  if(d.cassation?.actif){const c2=d.cassation;h+=`<h3>Cassation ${esc(c2.a2||'')}</h3><table><thead><tr><th>Désignation</th><th class="n">Année ${esc(c2.a1||'')}</th><th class="n">Année ${esc(c2.a2||'')}</th></tr></thead><tbody><tr><td>Épargne principale</td><td class="n">${F(c2.e1)}</td><td class="n">${F(c2.e2)}</td></tr><tr><td>Intérêts générés</td><td class="n">${F(c2.i1)}</td><td class="n">${F(c2.i2)}</td></tr></tbody><tfoot><tr><td>Total</td><td class="n">${F(cs.t1)}</td><td class="n">${F(cs.t2)}</td></tr></tfoot></table>${cs.t1?`<p>Progression : <b>${cs.p.toFixed(2).replace('.',',')} %</b>.</p>`:''}${para(c2.note)}`}
  if(d.annexTour!==false&&!opt.noTour&&S.tour?.rows?.length)h+=`<p>Le classement du prochain tour de cotisation figure en annexe.</p>`;
  h+=H('Divers et collation')+(para(d.divers)||'<p>Après les points inscrits à l’ordre du jour, les membres ont poursuivi leurs échanges dans une ambiance conviviale et fraternelle autour de la collation.</p>');
  h+=`<div class="motto">« ${esc(c.devise.toUpperCase())} »</div><p style="text-align:right"><b>Fin de séance :</b> ${esc((d.heureFin||'—').replace(':','h'))}</p>`;
  h+=sig([`Le/La Président(e) de séance<br><span style="font-weight:400">${esc(mname(d.president))}</span>`,`Le Secrétaire général<br><span style="font-weight:400">${esc(officer('secretaire')||mname(d.secretaireSeance))}</span>`]);
  const corr=(d.corrections||[]);if(corr.length)h+=`<h2>Rectificatifs apportés au compte rendu</h2><table><thead><tr><th>Date</th><th>Section</th><th>Demandé par</th><th>Élément initial</th><th>Correction</th></tr></thead><tbody>${corr.map(x=>`<tr><td>${fdate(x.date)}</td><td>${esc(x.section)}</td><td>${esc(x.par?mname(x.par):'Bureau')}</td><td>${esc(x.avant||'')}</td><td>${esc(x.apres||'')}</td></tr>`).join('')}</tbody></table>`;
  if(d.annexCot!==false&&Object.keys(d.cot||{}).length){const rows=Object.entries(d.cot).filter(([id,r])=>COT.some(([k])=>num(r[k]))||M(id));
    h+=`<div class="pb"></div><h2>Annexe 1 · Tableau récapitulatif des cotisations</h2><table style="font-size:10.5px"><thead><tr><th>Noms</th>${COT.map(([,l])=>`<th class="n">${l}</th>`).join('')}</tr></thead><tbody>${rows.map(([id,r])=>`<tr><td>${esc(mname(id))}${r.mode==='Virement bancaire'?' <sup>v</sup>':''}</td>${COT.map(([k])=>`<td class="n">${fmt(r[k])}</td>`).join('')}</tr>`).join('')}</tbody><tfoot><tr><td>Total</td>${COT.map(([k])=>`<td class="n">${fmt(s.t[k])}</td>`).join('')}</tr></tfoot></table><p style="font-size:11px">Montants en FCFA. <sup>v</sup> : réglé par virement bancaire.</p>`}
  if(d.annexTour!==false&&!opt.noTour&&S.tour?.rows?.length)h+=`<div class="pb"></div>`+tourDoc(true);
  return h;
}

  <table style="font-size:11.5px"><thead><tr><th>N°</th><th>Noms</th>${COT.map(([,l])=>`<th class="n">${l}</th>`).join('')}<th>Mode</th></tr></thead><tbody>${rows.map(([id,r],i)=>`<tr><td>${i+1}</td><td>${esc(mname(id))}</td>${COT.map(([k])=>`<td class="n">${fmt(r[k])}</td>`).join('')}<td>${esc(r.mode==='Virement bancaire'?'Virement'+(r.ref?' '+r.ref:''):r.mode||'Espèces')}</td></tr>`).join('')}</tbody>
  <tfoot><tr><td colspan="2">TOTAL</td>${COT.map(([k])=>`<td class="n">${fmt(s.t[k])}</td>`).join('')}<td></td></tr></tfoot></table>
  <table style="width:55%;margin-left:auto"><tbody><tr><td>Épargne totale</td><td class="n">${F(s.t.epargne)}</td></tr><tr><td>Montant sur la table</td><td class="n">${F(s.table)}</td></tr><tr><td>Emprunts du jour</td><td class="n">${F(s.emprunts)}</td></tr><tr><td><b>Reste en caisse</b></td><td class="n"><b>${F(s.reste)}</b></td></tr>${s.benef?`<tr><td>Tontine remise aux bénéficiaires</td><td class="n">${F(s.benef)}</td></tr>`:''}</tbody></table>
  <p style="font-size:11px">Montants en FCFA.</p>`+sig(['Le Trésorier<br><span style="font-weight:400">'+esc(officer('tresorier'))+'</span>','Le Secrétaire général<br><span style="font-weight:400">'+esc(officer('secretaire'))+'</span>','Le/La Président(e)<br><span style="font-weight:400">'+esc(officer('president'))+'</span>'])}
function cumulDoc(c){return `<h1>Cumul des cotisations par membre</h1><p style="text-align:center;margin-top:-6px">Du ${fdate(c.from)} au ${fdate(c.to)} · ${c.n} séance(s)</p>

  <tfoot><tr><td>TOTAL</td><td></td>${CUM.map(([k])=>`<td class="n">${fmt(c.tot[k])}</td>`).join('')}<td class="n">${fmt(c.tot.ep)}</td></tr></tfoot></table>`+sig(['Le Trésorier<br><span style="font-weight:400">'+esc(officer('tresorier'))+'</span>','Le Secrétaire général<br><span style="font-weight:400">'+esc(officer('secretaire'))+'</span>'])}
function tourDoc(annex){const t=S.tour||{rows:[]};const pv=partValue();const tot=t.rows.reduce((s,r)=>s+r.benef.reduce((a,b)=>a+num(b.p),0),0);
  let h=annex?`<h2>Annexe 2 · Classement du prochain tour ${esc(t.cycle||'')}</h2>`:`<h1>Classement du prochain tour — ${esc(cfg().nom)}</h1><p style="text-align:center">Cycle ${esc(t.cycle||'')}</p>`;

  if((t.tirage||[]).length)h+=`<h3>Résultat du tirage au sort</h3><table style="font-size:12px"><thead><tr><th>Ordre</th><th>Membre</th><th class="n">Parts</th><th>Ordre</th><th>Membre</th><th class="n">Parts</th></tr></thead><tbody>${(()=>{const a=t.tirage,half=Math.ceil(a.length/2);let r='';for(let i=0;i<half;i++){const x=a[i],y=a[i+half];r+=`<tr><td>${i+1}</td><td>${esc(mname(x.m))}</td><td class="n">${fmt(x.p)}</td><td>${y?i+half+1:''}</td><td>${y?esc(mname(y.m)):''}</td><td class="n">${y?fmt(y.p):''}</td></tr>`}return r})()}</tbody><tfoot><tr><td colspan="5">TOTAL</td><td class="n">${fmt(t.tirage.reduce((s,x)=>s+num(x.p),0))} parts</td></tr></tfoot></table>`;

function ficheDoc(d,b,x){const m=M(b.m)||{};const brut=num(b.montant),ret=num(x.retenue),net=brut-ret;const tr=(S.tour?.rows||[]).find(r=>r.benef.some(z=>z.m===b.m)&&r.mois===ym(d.date));

  return html}
function printHTML(inner,title,landscape){if(typeof isMember==='function'&&isMember()){toast('Consultation uniquement.');return}const html=buildPrintHTML(inner,title,landscape);
  const fr=document.createElement('iframe');fr.setAttribute('aria-hidden','true');fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';document.body.appendChild(fr);
  const d=fr.contentDocument;d.open();d.write(html);d.close();
  const run=()=>{try{fr.contentWindow.focus();fr.contentWindow.print()}catch(e){toast("L'impression n'a pas pu démarrer : utilisez le menu Imprimer du navigateur.")}setTimeout(()=>fr.remove(),120000)};
  const imgs=[...d.images];Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))).then(()=>setTimeout(run,200));
}

function modal({title,body,footer,wide,onSubmit,perm}){

  w.innerHTML=`<form class="modal ${wide?'wide':''}" novalidate><header><h2>${title}</h2><button type="button" class="btn ghost sm" data-close aria-label="Fermer">✕</button></header><div class="body">${body}</div><footer>${footer||`<button type="button" class="btn" data-close>Annuler</button><button class="btn pri" type="submit">Enregistrer</button>`}</footer></form>`;
  $('#modals').appendChild(w);

  const f=w.querySelector('form');f.addEventListener('submit',async e=>{e.preventDefault();if(perm&&!can(perm)){toast(DENY[perm]);return}if(onSubmit){const r=await onSubmit(formObj(f),f);if(r!==false)closeModal(w)}});

function confirmBox(text,fn){modal({title:'Confirmer',body:`<p style="margin:0">${text}</p>`,footer:`<button type="button" class="btn" data-close>Annuler</button><button class="btn pri" type="submit" style="background:var(--bad);border-color:var(--bad)">Supprimer</button>`,onSubmit:()=>{fn()}})}
function lastEpargne(mid){const d=meetings().find(x=>num(x.cot?.[mid]?.epargne));return d?num(d.cot[mid].epargne):0}

/* ---------- member : fiche d'identification ---------- */
function seqOf(mat){const g=String(mat||'').match(/(\d+)\s*$/);return g?parseInt(g[1]):0}
function genMatricule(date,exceptId){const n=members(true).filter(m=>m.id!==exceptId).map(m=>seqOf(m.matricule));const seq=(n.length?Math.max(...n):0)+1;const y=String(date||'').slice(0,4)||String(new Date().getFullYear());return `TW-${y}-${String(seq).padStart(3,'0')}`}
const nextMatricule=()=>genMatricule(today());
const MFIELDS=['photo','telephone','whatsapp','adresse','dateAdhesion','nom','prenoms','dateNaissance','profession','pieceNumero','urgenceTel'];
const completeness=m=>Math.round(MFIELDS.filter(k=>m[k]).length/MFIELDS.length*100);
const waLink=t=>{let d=String(t||'').replace(/\D/g,'');if(!d)return '';if(d.length===8)d='228'+d;return 'https://wa.me/'+d};
function resizePhoto(src,cb){const img=new Image();img.onload=()=>{const s=Math.min(img.width,img.height);const c=document.createElement('canvas');c.width=c.height=360;c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,360,360);cb(c.toDataURL('image/jpeg',.86))};img.onerror=()=>toast("Cette image ne peut pas être lue.");img.src=src}
function webcamModal(cb){let stream=null;
  const w=modal({title:'Prendre une photo',body:`<div class="cam"><video id="camv" autoplay playsinline muted></video><div class="cam-frame"></div></div><p class="hint">Placez le visage dans le cadre, puis cliquez sur « Capturer ».</p>`,footer:`<button type="button" class="btn" data-close>Annuler</button><button type="button" class="btn pri keep" id="camshot">${ico('cam')}Capturer</button>`});
  const stop=()=>stream&&stream.getTracks().forEach(t=>t.stop());w.addEventListener('click',e=>{if(e.target===w||e.target.closest('[data-close]'))stop()});
  if(!navigator.mediaDevices?.getUserMedia){toast("Aucune caméra disponible : choisissez plutôt un fichier photo.");closeModal(w);return}
  navigator.mediaDevices.getUserMedia({video:{width:640,height:480}}).then(st=>{stream=st;$('#camv',w).srcObject=st}).catch(()=>{toast("La caméra n'est pas accessible. Vérifiez qu'elle est branchée et autorisée.");closeModal(w)});
  $('#camshot',w).onclick=()=>{const v=$('#camv',w);if(!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);stop();w.remove();resizePhoto(c.toDataURL('image/jpeg',.92),cb)};
}

/* ---------- aides : barème de l'article 22 ---------- */
const BAREME=[
 ['Hospitalisation d’un membre (3 jours et plus)',35000,'une fois par an'],
 ['Intervention chirurgicale d’un membre (acte ≥ K50)',50000,'une fois par an'],
 ['Hospitalisation d’un enfant à charge (3 jours et plus)',25000,'une fois par an'],
 ['Hospitalisation du conjoint (3 jours et plus)',25000,'une fois par an, mariage civil ou coutumier'],
 ['Naissance chez un membre',30000,'plus main levée'],
 ['Fausse couche',0,'main levée'],
 ['Décès d’un membre',500000,'veillée, cercueil, habillement ou rapatriement'],
 ['Décès du père ou de la mère d’un membre',0,'main levée obligatoire à partir de 5 000 FCFA par membre'],
 ['Décès d’un enfant ou du conjoint d’un membre',100000,''],
 ['Mariage civil ou religieux d’un membre',100000,'un seul mariage par membre'],
 ['Mariage de l’enfant d’un membre',30000,''],
 ['Première communion ou baptême d’un membre',30000,''],
 ['Baptême ou première communion de l’enfant d’un membre',20000,''],
 ['Soutenance d’un membre',30000,''],
 ['Autre',0,'']];
function aidChecks(mid,nature,date,exceptId){if(!mid)return '';const out=[];const c=cfg();
  const recent=meetings().filter(d=>d.date<=(date||today())&&d.cot&&Object.keys(d.cot).length).slice(0,3);
  if(recent.length===3&&recent.every(d=>num(d.cot?.[mid]?.solidarite)<num(c.solidarite||1)))out.push(`${esc(mname(mid))} n'a pas payé la solidarité aux 3 dernières séances : selon l'article 22, un membre défaillant de plus de 3 mois ne bénéficie pas des avantages.`);
  const b=BAREME.find(x=>x[0]===nature);const yr=String(date||today()).slice(0,4);
  if(b&&/une fois par an/.test(b[2])&&list('aids').some(a=>a.id!==exceptId&&a.membre===mid&&a.nature===nature&&String(a.date).startsWith(yr)))out.push(`Cette aide a déjà été accordée à ${esc(mname(mid))} en ${yr} (limite : une fois par an).`);
  if(nature.startsWith('Mariage civil')&&list('aids').some(a=>a.id!==exceptId&&a.membre===mid&&a.nature===nature))out.push(`L'association ne contribue qu'à un seul mariage par membre : une aide de ce type existe déjà.`);
  return out.map(t=>`<div class="note-warn" style="margin-bottom:8px">${t}</div>`).join('')}

/* ---------- aid / transfer / event / suggestion ---------- */

  const draw=()=>`<div class="grid g3">${fld('cycle','Cycle',t.cycle,'placeholder="2026-2027"')}${fld('debut','Première AG du tour',t.debut,'type="date"')}${fld('fin','Dernière AG du tour (cassation)',t.fin,'type="date"')}${money('valeurPart','Valeur d’une part (FCFA)',t.valeurPart)}<div class="f" style="justify-content:flex-end"><span class="hint">Total des parts : <b>${fmt(t.rows.reduce((s,r)=>s+r.benef.reduce((a,b)=>a+num(b.p),0),0))}</b></span></div></div>
   <h3 style="margin:18px 0 8px;font-size:15px">Mois et bénéficiaires</h3><div class="stack" style="gap:10px">${t.rows.map((r,ri)=>`<div class="card" style="padding:12px"><div class="row" style="margin-bottom:8px"><span class="mono muted">${String(ri+1).padStart(2,'0')}</span><input class="i" type="month" name="mois_${ri}" value="${esc(r.mois)}" style="max-width:190px"><button type="button" class="btn sm" data-addb="${ri}">${ico('plus')}Bénéficiaire</button><button type="button" class="btn ghost sm danger" data-rmrow="${ri}" style="margin-left:auto">${ico('trash')}Retirer le mois</button></div><div class="stack" style="gap:6px">${r.benef.map((b,bi)=>benRow('r'+ri,b,bi)).join('')}</div></div>`).join('')}</div>
   <button type="button" class="btn sm" id="addrow" style="margin-top:10px">${ico('plus')}Ajouter un mois</button>
   <h3 style="margin:22px 0 8px;font-size:15px">Ordre du tirage au sort</h3><div class="stack" style="gap:6px">${t.tirage.map((b,i)=>`<div class="row" style="flex-wrap:nowrap;gap:6px"><span class="mono muted" style="width:24px">${i+1}</span>${benRow('tg',b,i).replace(/^<div class="row"[^>]*>/,'').replace(/<\/div>$/,'')}</div>`).join('')}</div><button type="button" class="btn sm" id="addtg" style="margin-top:8px">${ico('plus')}Ajouter au tirage</button>`;
  const read=f=>{const o=formObj(f);t.cycle=o.cycle;t.debut=o.debut;t.fin=o.fin;t.valeurPart=o.valeurPart;t.rows=t.rows.map((r,ri)=>({mois:o['mois_'+ri]||r.mois,benef:r.benef.map((b,bi)=>({m:o[`r${ri}_m_${bi}`],p:num(o[`r${ri}_p_${bi}`])}))}));t.tirage=t.tirage.map((b,i)=>({m:o['tg_m_'+i],p:num(o['tg_p_'+i])}))};
  const w=modal({title:'Tour de cotisation',wide:true,perm:'fin',body:draw(),onSubmit:(o,f)=>{read(f);t.rows=t.rows.filter(r=>r.mois).map(r=>({...r,benef:r.benef.filter(b=>b.m)})).sort((a,b)=>a.mois.localeCompare(b.mois));t.tirage=t.tirage.filter(b=>b.m);put('tour','current',t);toast('Tour enregistré')}});
  const f=w.querySelector('form'),body=w.querySelector('.body');
  const wire=()=>{const redo=()=>{body.innerHTML=draw();wire()};
    $('#addrow',w).onclick=()=>{read(f);const last=t.rows[t.rows.length-1]?.mois;t.rows.push({mois:last?addMonths(last+'-15',1).slice(0,7):ym(today()),benef:[{m:'',p:''}]});redo()};
    $('#addtg',w).onclick=()=>{read(f);t.tirage.push({m:'',p:''});redo()};
    $$('[data-addb]',w).forEach(b=>b.onclick=()=>{read(f);t.rows[+b.dataset.addb].benef.push({m:'',p:''});redo()});
    $$('[data-rmrow]',w).forEach(b=>b.onclick=()=>{read(f);t.rows.splice(+b.dataset.rmrow,1);redo()});
    $$('[data-rm]',w).forEach(b=>b.onclick=()=>{read(f);const [p,i]=b.dataset.rm.split('|');if(p==='tg')t.tirage.splice(+i,1);else t.rows[+p.slice(1)].benef.splice(+i,1);redo()})};wire();

/* ---------- assistant de rédaction (Internet) ---------- */
const AI_KEY='thetwelve-ai-key',AI_MODEL='thetwelve-ai-model';
const aiKey=()=>{try{return localStorage.getItem(AI_KEY)||''}catch(e){return ''}};
const aiModel=()=>{try{return localStorage.getItem(AI_MODEL)||'claude-sonnet-5-5'}catch(e){return 'claude-sonnet-5-5'}};
async function callClaude(prompt,maxTokens){
  const key=aiKey();if(!key)throw {code:'nokey'};
  if(navigator.onLine===false)throw {code:'offline'};
  let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:aiModel(),max_tokens:maxTokens||2000,messages:[{role:'user',content:prompt}]})})}catch(e){throw {code:'offline'}}
  if(!r.ok){let m='';try{m=(await r.json()).error?.message||''}catch(e){}throw {code:r.status===401?'badkey':r.status===429?'rate':r.status===529||r.status>=500?'busy':r.status===404?'model':'http',message:m}}
  const j=await r.json();return (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim()}
const AI_ERR={nokey:"Configurez d'abord la clé API dans Paramètres › Assistant de rédaction.",offline:"Pas de connexion Internet : le bouton fonctionne dès que l'ordinateur est connecté.",badkey:"La clé API est refusée. Vérifiez-la dans Paramètres.",rate:'Trop de demandes, réessayez dans un moment.',busy:'Le service est momentanément surchargé, réessayez dans un moment.',model:"Ce modèle n'est pas disponible avec votre clé. Choisissez-en un autre dans Paramètres.",http:'La reformulation a échoué.'};
async function aiPolish(k,btn){
  const ta=$(`textarea[data-k="${k}"],input[data-k="${k}"]`);if(!ta)return;const src=ta.value.trim();if(!src){toast('Écrivez d’abord quelques notes à mettre en forme.');return}
  if(!aiKey()){toast(AI_ERR.nokey);return}
  const who=k.startsWith('nouv.')?`Ces nouvelles concernent le membre ${mname(k.slice(5))}. Écris à la troisième personne en commençant directement par la phrase (sans répéter son nom en tête).`:'';
  const prompt=`Tu es le secrétaire général de THE TWELVE, une association d'entraide (tontine, épargne, prêts, solidarité) dont les membres vivent à Lomé. Reformule les notes ci-dessous pour le compte rendu officiel d'une assemblée générale : français soigné et sobre, phrases complètes, ton fraternel et respectueux. N'invente aucun fait, nom, chiffre ni date ; garde tous les montants exacts. ${who} Réponds uniquement par le texte final, sans titre ni guillemets.\n\nNotes :\n${src}`;
  const old=btn.innerHTML;btn.disabled=true;btn.textContent='Rédaction…';
  try{const t=await callClaude(prompt);if(t){S._undo={k,v:src};ta.value=t;setPath(D,k,t);touch();toastUndo()}}
  catch(e){toast(AI_ERR[e?.code]||AI_ERR.http)}
  btn.disabled=false;btn.innerHTML=old}
function toastUndo(){const t=document.createElement('div');t.className='toast';t.innerHTML='Texte reformulé. <button class="btn sm" style="margin-left:10px">Annuler</button>';document.body.appendChild(t);
  t.querySelector('button').onclick=()=>{const u=S._undo;if(u&&D){setPath(D,u.k,u.v);const ta=$(`textarea[data-k="${u.k}"]`);if(ta)ta.value=u.v;touch()}t.remove()};setTimeout(()=>t.remove(),8000)}

async function twDecrypt(code){const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const E=SEED_ENC;
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(E.s),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(E.i)},key,b(E.c));return JSON.parse(new TextDecoder().decode(pt))}

  $('#unlockform').onsubmit=async e=>{e.preventDefault();const v=$('#unlock-code').value.trim().toUpperCase();const btn=e.target.querySelector('button');btn.disabled=true;
    try{const o=await twDecrypt(v);try{await svSetCode(v)}catch(x){}res(o)}catch(x){$('#unlock-err').textContent="Code incorrect. Vérifiez les tirets et les lettres.";btn.disabled=false}};
  $('#unlock-file').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.members||!o.meetings)throw 0;res(o)}catch(x){$('#unlock-err').textContent="Ce fichier n'est pas une sauvegarde THE TWELVE."}};r.readAsText(f)};
  setTimeout(()=>$('#unlock-code')?.focus(),50)})}
